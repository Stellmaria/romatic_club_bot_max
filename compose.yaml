services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  supervisor-proxy:
    image: ${SUPERVISOR_PROXY_IMAGE:-romatic-server-supervisor-proxy:local}
    build:
      context: .
      dockerfile: Dockerfile.server-supervisor-proxy
    restart: unless-stopped
    user: "${ROMATIC_SUPERVISOR_GID:-10001}:${ROMATIC_SUPERVISOR_GID:-10001}"
    environment:
      SERVER_SUPERVISOR_SOCKET: ${SERVER_SUPERVISOR_SOCKET:-/runtime/supervisor/romatic-server-supervisor.sock}
      SERVER_SUPERVISOR_PROXY_HOST: 0.0.0.0
      SERVER_SUPERVISOR_PROXY_PORT: 8765
    volumes:
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2); payload = json.load(response); assert response.status == 200 and payload.get('ok') is True
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: ${SUPERVISOR_PROXY_MEMORY_LIMIT:-128m}
    cpus: ${SUPERVISOR_PROXY_CPU_LIMIT:-0.25}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      romatic-supervisor-control:
        aliases:
          - supervisor-proxy
      hermes-supervisor-control:
        aliases:
          - romatic-supervisor

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SUPERVISOR_TOKEN: ""
      SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_token
    secrets:
      - supervisor_token
    command: ["python", "main.py"]
    volumes:
      - ./var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      supervisor-proxy:
        condition: service_started
    networks:
      default: {}
      romatic-supervisor-control: {}

  userbot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      SUPERVISOR_ENABLED: "false"
      SUPERVISOR_TOKEN: ""
      SUPERVISOR_TOKEN_FILE: ""
      SUPERVISOR_BASE_URL: ""
    command: ["python", "-m", "userbot.entrypoint"]
    volumes:
      - ./var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}

volumes:
  postgres_data:

secrets:
  supervisor_token:
    file: ${SUPERVISOR_TOKEN_FILE_HOST:-./server-data/runtime/supervisor/token}

networks:
  romatic-supervisor-control:
    name: ${ROMATIC_SUPERVISOR_NETWORK:-romatic-supervisor-control}
    driver: bridge
    internal: true
  hermes-supervisor-control:
    name: ${HERMES_SUPERVISOR_NETWORK:-hermes-supervisor-control}
    driver: bridge
    internal: true
    attachable: true
