services:
  postgres:
    image: ${POSTGRES_IMAGE:-romatic-postgres:17-alpine-hardened}
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      romatic-database: {}

  supervisor-proxy:
    image: ${SUPERVISOR_PROXY_IMAGE:-romatic-server-supervisor-proxy:local}
    build:
      context: .
      dockerfile: Dockerfile.server-supervisor-proxy
    restart: unless-stopped
    user: "${ROMATIC_SUPERVISOR_GID:-10001}:${ROMATIC_SUPERVISOR_GID:-10001}"
    environment:
      SERVER_SUPERVISOR_SOCKET: ${SERVER_SUPERVISOR_SOCKET:-/runtime/supervisor/romatic-server-supervisor.sock}
      SERVER_SUPERVISOR_PROXY_HOST: 0.0.0.0
      SERVER_SUPERVISOR_PROXY_PORT: 8765
    volumes:
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime:/runtime
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2); payload = json.load(response); assert response.status == 200 and payload.get('ok') is True
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: ${SUPERVISOR_PROXY_MEMORY_LIMIT:-128m}
    cpus: ${SUPERVISOR_PROXY_CPU_LIMIT:-0.25}
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      romatic-supervisor-control:
        aliases:
          - supervisor-proxy
      hermes-supervisor-control:
        aliases:
          - romatic-supervisor

  runtime-permissions:
    image: ${BOT_IMAGE:-romaticclub-bot}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ceu"]
    command:
      - |
        mkdir -p /runtime/bot /runtime/userbot
        chown -R "$${ROMATIC_APP_UID}:$${ROMATIC_APP_GID}" /runtime/bot /runtime/userbot
        chmod 0700 /runtime/bot /runtime/userbot
    environment:
      ROMATIC_APP_UID: ${ROMATIC_APP_UID:-10001}
      ROMATIC_APP_GID: ${ROMATIC_APP_GID:-10001}
    volumes:
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime/bot:/runtime/bot
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime/userbot:/runtime/userbot
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    restart: "no"

  bot:
    image: ${BOT_IMAGE:-romaticclub-bot}
    build:
      context: .
      args:
        REQUIREMENTS_LOCK: requirements/bot.lock
    restart: unless-stopped
    init: true
    user: "${ROMATIC_APP_UID:-10001}:${ROMATIC_APP_GID:-10001}"
    env_file:
      - ${BOT_ENV_FILE:-.env.bot}
    environment:
      RUNTIME_DIR: /app/var
      SUPERVISOR_TOKEN: ""
      SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_token
    secrets:
      - supervisor_token
    command: ["python", "main.py"]
    volumes:
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime/bot:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=3); payload = json.load(response); assert response.status == 200 and payload.get('ready') is True and payload.get('database') is True
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: ${BOT_MEMORY_LIMIT:-512m}
    cpus: ${BOT_CPU_LIMIT:-1.0}
    pids_limit: ${BOT_PIDS_LIMIT:-256}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${BOT_STOP_GRACE_PERIOD:-45s}
    depends_on:
      runtime-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      supervisor-proxy:
        condition: service_healthy
    networks:
      romatic-application: {}
      romatic-database: {}
      romatic-supervisor-control: {}

  userbot:
    build:
      context: .
      args:
        REQUIREMENTS_LOCK: requirements/userbot.lock
    restart: unless-stopped
    init: true
    user: "${ROMATIC_APP_UID:-10001}:${ROMATIC_APP_GID:-10001}"
    env_file:
      - ${USERBOT_ENV_FILE:-.env.userbot}
    environment:
      RUNTIME_DIR: /app/var
      USERBOT_SESSION: /run/romatic-userbot-session/userbot
      SUPERVISOR_ENABLED: "false"
      SUPERVISOR_TOKEN: ""
      SUPERVISOR_TOKEN_FILE: ""
      SUPERVISOR_BASE_URL: ""
    command: ["python", "-m", "userbot.entrypoint"]
    stdin_open: false
    tty: false
    volumes:
      - ${ROMATIC_DATA_DIR:-./server-data}/runtime/userbot:/app/var
      - ${ROMATIC_DATA_DIR:-./server-data}/userbot-session:/run/romatic-userbot-session
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - userbot.healthcheck
        - --file
        - /app/var/userbot-health.json
        - --max-age
        - "30"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${USERBOT_MEMORY_LIMIT:-512m}
    cpus: ${USERBOT_CPU_LIMIT:-1.0}
    pids_limit: ${USERBOT_PIDS_LIMIT:-256}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${USERBOT_STOP_GRACE_PERIOD:-45s}
    depends_on:
      runtime-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      romatic-application: {}
      romatic-database: {}

volumes:
  postgres_data:

secrets:
  supervisor_token:
    file: ${SUPERVISOR_TOKEN_FILE_HOST:-./server-data/runtime/supervisor/token}

networks:
  romatic-application:
    name: ${ROMATIC_APPLICATION_NETWORK:-romatic-application}
    driver: bridge
  romatic-database:
    name: ${ROMATIC_DATABASE_NETWORK:-romatic-database}
    driver: bridge
    internal: true
  romatic-supervisor-control:
    name: ${ROMATIC_SUPERVISOR_NETWORK:-romatic-supervisor-control}
    driver: bridge
    internal: true
  hermes-supervisor-control:
    name: ${HERMES_SUPERVISOR_NETWORK:-hermes-supervisor-control}
    driver: bridge
    internal: true
    attachable: true
