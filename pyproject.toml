[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-telegram-bot"
version = "0.7.0"
description = "Telegram auction, exchange and moderation application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Auction Bot Team" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
tools = ["pandas==2.3.3"]

[project.scripts]
auction-bot = "main:main"
auction-userbot = "userbot.entrypoint:run"
auction-route-inventory = "bot.bootstrap.route_inventory:main"

[tool.setuptools]
py-modules = ["config", "fsm_states", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "database*", "db*", "userbot*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
database = ["*.sql", "README.md"]
db = ["migrations/*.sql"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: destructive tests requiring POSTGRES_INTEGRATION_CONFIRM=1 and disposable PostgreSQL 17",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "var", "private"]

[tool.ruff.lint]
# The legacy codebase is migrated incrementally. CI starts with correctness
# errors; style families can be enabled per package as monoliths are split.
select = ["E9", "F63", "F7", "F82"]

[tool.black]
target-version = ["py313"]
line-length = 100
extend-exclude = "(/migrations/|/var/|/private/)"
