[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-telegram-bot"
version = "0.7.0"
description = "Telegram auction, exchange and moderation application"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Auction Bot Team" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
tools = ["pandas==2.3.3"]

[project.scripts]
auction-bot = "main:main"
auction-userbot = "userbot.entrypoint:run"
auction-userbot-provision = "userbot.provision:run"
auction-userbot-healthcheck = "userbot.healthcheck:run"
auction-route-inventory = "bot.bootstrap.route_inventory:main"

[tool.setuptools]
py-modules = ["config", "fsm_states", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bot*", "database*", "db*", "userbot*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
database = ["*.sql", "README.md"]
db = ["migrations/*.sql"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/bot.in", "requirements/userbot.in"] }

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: destructive tests requiring POSTGRES_INTEGRATION_CONFIRM=1 and disposable PostgreSQL 17",
]

[tool.coverage.run]
branch = true
parallel = false
source = ["bot", "db", "userbot"]
omit = [
  "*/__main__.py",
  "*/migrations/*",
  "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "var", "private", "db/migrations"]

[tool.ruff.lint]
# The full legacy tree stays on a correctness baseline. scripts/quality.py
# applies the extended ratchet to changed files.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["bot", "database", "db", "userbot"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S607"]
# Russian operator documentation intentionally uses Cyrillic characters.
# Existing operational log and SQL literals are kept readable as atomic text.
"bot/tools/refresh_users.py" = ["RUF002", "RUF003", "E501"]
"scripts/check_immutable_references.py" = ["E501"]
"scripts/migrate_uid_encryption.py" = ["E501"]
"tests/test_python_runtime_contract.py" = ["E501"]
# This runner creates an isolated disposable database with a fixed local-only password,
# and its top-level cleanup boundary must report failures from Docker and diagnostics.
"scripts/run_postgres_integration.py" = ["S105", "BLE001"]
# The fake accepts the production callable's keyword-compatible signature.
"tests/test_server_supervisor_contract.py" = ["ARG001"]
# The XML is a JUnit artifact generated by pytest inside the same trusted CI job.
"scripts/quality.py" = ["S314"]

[tool.black]
target-version = ["py313"]
line-length = 100
extend-exclude = "(/migrations/|/var/|/private/)"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = "(^tests/|^db/migrations/|^var/|^private/)"

[[tool.mypy.overrides]]
module = [
  "aiogram.*",
  "asyncpg.*",
  "telethon.*",
  "cryptography.*",
  "dateutil.*",
]
ignore_missing_imports = true

# The deprecated aggregate intentionally exposes dynamic read-only aliases.
# Keep its compatibility surface isolated while process-scoped settings remain strict.
[[tool.mypy.overrides]]
module = ["bot.core.settings"]
disable_error_code = ["arg-type", "no-untyped-def"]
