services:
  webapp:
    image: ${WEBAPP_IMAGE:-romaticclub-webapp}
    build:
      context: .
      dockerfile: Dockerfile.webapp
    restart: unless-stopped
    init: true
    user: "${ROMATIC_APP_UID:-10001}:${ROMATIC_APP_GID:-10001}"
    env_file:
      - ${WEBAPP_ENV_FILE:-.env.webapp}
    environment:
      DB_AUTO_MIGRATE: "false"
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: 8080
    ports:
      - "${WEBAPP_BIND_ADDRESS:-127.0.0.1}:${WEBAPP_PUBLISH_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); payload = json.load(response); assert response.status == 200 and payload.get('status') == 'ok'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${WEBAPP_MEMORY_LIMIT:-384m}
    cpus: ${WEBAPP_CPU_LIMIT:-0.75}
    pids_limit: ${WEBAPP_PIDS_LIMIT:-192}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${WEBAPP_STOP_GRACE_PERIOD:-30s}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      romatic-application: {}
      romatic-database: {}
