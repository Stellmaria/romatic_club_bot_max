name: Observability Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: observability-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install exact formatter graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Print exact Black diff
        run: |
          python -m black --diff --no-color \
            bot/core/logging.py \
            bot/core/observability.py \
            tests/test_observability.py || true
