name: PR 98 autofix

on:
  push:
    branches: [feat/issue-42-observability]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-42-observability
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
      - name: Install pinned development dependencies
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Apply deterministic formatting and locks
        run: |
          python -m black scripts/validate_monitoring.py tests/test_monitoring_config.py
          uv pip compile --python-version 3.13 --generate-hashes --no-emit-index-url --output-file requirements/bot.lock requirements/bot.in
          uv pip compile --python-version 3.13 --generate-hashes --no-emit-index-url --output-file requirements/userbot.lock requirements/userbot.in
          uv pip compile --python-version 3.13 --generate-hashes --no-emit-index-url --output-file requirements/tools.lock requirements/tools.in
          uv pip compile --python-version 3.13 --generate-hashes --no-emit-index-url --output-file requirements/dev.lock requirements/dev.in
      - name: Commit autofixes and remove helper workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr98-autofix.yml
          git add scripts/validate_monitoring.py tests/test_monitoring_config.py requirements/*.lock
          git commit -m 'fix(ci): apply deterministic formatting and lock generation'
          git push origin HEAD:feat/issue-42-observability
