name: Source Export

on:
  push:
    branches:
      - codex/issue-27-central-config

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
