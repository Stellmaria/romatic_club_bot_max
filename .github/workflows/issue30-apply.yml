name: Apply issue 30 implementation

on:
  push:
    branches: [refactor/issue-30-application-use-cases]
    paths:
      - '.issue30/**'

permissions:
  contents: write

concurrency:
  group: issue30-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-30-application-use-cases
      - name: Apply source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .issue30/part-* | base64 --decode > "$RUNNER_TEMP/issue30.tar.xz"
          tar -xJf "$RUNNER_TEMP/issue30.tar.xz"
          rm -rf .issue30
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bot/handlers/admin/action_support/roles.py \
            bot/handlers/admin/admin_panel_schedule.py \
            bot/handlers/admin/moderation_lots.py \
            bot/handlers/admin/uid_verification_review.py \
            bot/handlers/auction/exchange/moderation.py \
            bot/handlers/auction/exchange/submission.py \
            bot/handlers/auction/publication.py \
            bot/handlers/auction/submission.py \
            bot/handlers/users.py \
            bot/repositories/exchanges.py \
            bot/services/exchanges.py \
            bot/services/roles.py \
            bot/use_cases/__init__.py \
            bot/use_cases/auction_cancellation.py \
            bot/use_cases/auction_moderation.py \
            bot/use_cases/auction_publication.py \
            bot/use_cases/auction_submission.py \
            bot/use_cases/common.py \
            bot/use_cases/exchange_moderation.py \
            bot/use_cases/exchange_submission.py \
            bot/use_cases/roles.py \
            bot/use_cases/uid_moderation.py \
            bot/use_cases/user_lot_edit.py \
            tests/test_architecture_boundaries.py \
            tests/test_issue30_application_use_cases.py \
            .issue30
          git diff --cached --check
          git commit -m "refactor(application): complete issue 30 use cases"
          git push origin HEAD:refactor/issue-30-application-use-cases
