name: Temporary Issue99 Formatter

on:
  push:
    branches:
      - fix/issue99-verified-message-id-replacement

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'Stellmaria'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue99-verified-message-id-replacement
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - run: python -m black bot/services/auction_publication_repair.py userbot/publication_recovery.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot/services/auction_publication_repair.py userbot/publication_recovery.py
          git commit -m "style: format issue99 replacement"
          git push origin HEAD:fix/issue99-verified-message-id-replacement
