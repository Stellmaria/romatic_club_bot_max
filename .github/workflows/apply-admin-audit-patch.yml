name: Apply admin audit patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".admin-audit-patch-part-*"
      - ".github/workflows/apply-admin-audit-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/admin-button-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-button-audit
          fetch-depth: 0
      - name: Apply audited changes
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          expected = {
              '.admin-audit-patch-part-00': (18000, 'e687f1d696df354b0a75829c571b7cd0defbc35ff612ded1a393c0be4eed2b51'),
              '.admin-audit-patch-part-01': (18000, '57f2bda0fadb5025d0a607725a326ca24f4f150f275b4b511a68247a1b9ea081'),
              '.admin-audit-patch-part-02': (18000, '0700b0409c0879ee572634cac8a25684129eeb48e178d340f172b7c1aee20de3'),
              '.admin-audit-patch-part-03': (18000, '5de269c576df0e994f9ae1190e093919491be96ea17ebaef7985256465e456f1'),
              '.admin-audit-patch-part-04': (18000, '2e52397aab80496b1752c3b06d75650dcecdcbcccc264650c12589265624e8c9'),
              '.admin-audit-patch-part-05': (15528, 'd66136ab2f274bbfe9a50b1b231b3f90f05bad386a3be76c21770df6b91d717b'),
          }

          def clean(value: str) -> str:
              return re.sub(r'[^A-Za-z0-9+/=]', '', value)

          def digest(value: str) -> str:
              return hashlib.sha256(value.encode()).hexdigest()

          output = bytearray()
          for part in sorted(Path('.').glob('.admin-audit-patch-part-*')):
              suffix = part.name.rsplit('-', 1)[-1]
              repairs = sorted(Path('.').glob(f'.admin-audit-repair-{suffix}-*'))
              if repairs:
                  encoded = ''.join(clean(item.read_text(encoding='utf-8')) for item in repairs)
              else:
                  encoded = clean(part.read_text(encoding='utf-8'))
              expected_len, expected_hash = expected[part.name]
              if len(encoded) != expected_len or digest(encoded) != expected_hash:
                  raise RuntimeError(
                      f'{part.name}: checksum validation failed '
                      f'(length={len(encoded)}, sha256={digest(encoded)})'
                  )
              normalized = encoded.rstrip('=')
              normalized += '=' * (-len(normalized) % 4)
              output.extend(base64.b64decode(normalized, validate=True))
          Path('/tmp/admin-audit.patch').write_bytes(output)
          PY
          git apply --check /tmp/admin-audit.patch
          git apply /tmp/admin-audit.patch
          rm -f .admin-audit-patch-part-* .admin-audit-repair-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить навигацию и кнопки админ-панели"
          git push origin HEAD:agent/admin-button-audit
