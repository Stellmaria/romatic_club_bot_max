name: Apply admin audit patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".admin-audit-patch-part-*"
      - ".github/workflows/apply-admin-audit-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/admin-button-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-button-audit
          fetch-depth: 0
      - name: Apply audited changes
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import re
          from pathlib import Path

          output = bytearray()
          for part in sorted(Path('.').glob('.admin-audit-patch-part-*')):
              encoded = part.read_text(encoding='utf-8')
              encoded = re.sub(r'[^A-Za-z0-9+/=]', '', encoded)
              print(part.name, len(encoded), hashlib.sha256(encoded.encode()).hexdigest(), flush=True)
              normalized = encoded.rstrip('=')
              normalized += '=' * (-len(normalized) % 4)
              output.extend(base64.b64decode(normalized, validate=False))
          Path('/tmp/admin-audit.patch').write_bytes(output)
          PY
          git apply --check /tmp/admin-audit.patch
          git apply /tmp/admin-audit.patch
          rm -f .admin-audit-patch-part-*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить навигацию и кнопки админ-панели"
          git push origin HEAD:agent/admin-button-audit
