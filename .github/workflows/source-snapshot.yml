name: Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download exact CI tools
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          ruff==0.16.1 black==26.5.1 pytokens==0.4.1 click==8.4.2
          mypy==1.20.2 librt==0.13.0 mypy-extensions==1.1.0 packaging==26.2
          pathspec==1.1.1 platformdirs==4.11.0 typing-extensions==4.16.0
          aiogram==3.30.0 aiohttp==3.14.3
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: ci-tools
          path: "*.whl"
          retention-days: 1
