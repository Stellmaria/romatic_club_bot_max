name: Migration Contract Refresh

on:
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Update exact migration resource contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          old = "assert items[-1].filename == '019_deferred_auction_publication.sql'"
          new = "assert items[-1].filename == '020_privacy_export_audit_immutability.sql'"
          if text.count(old) != 1:
              raise SystemExit('unexpected migration contract state')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/migration-contract-refresh.yml
          git add .github/workflows/ci.yml
          git diff --cached --check
      - name: Commit contract refresh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: expect privacy audit migration in wheel"
          git push origin "HEAD:${HEAD_BRANCH}"
