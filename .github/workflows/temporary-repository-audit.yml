name: Temporary Repository Audit

on:
  push:
    branches: [codex/issue-37-time-policy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build repository audit artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p var/repository-audit
          git ls-files > var/repository-audit/files.txt
          {
            git grep -nE 'datetime\.(now|today)|date\.today|fromisoformat|pytz|dateutil\.tz|ZoneInfo|timestamp with(out)? time zone|TIMESTAMPTZ|TIMESTAMP' -- '*.py' '*.sql' '*.toml' '*.txt' '*.md' || true
          } > var/repository-audit/time-usage.txt
          git archive --format=zip --output=var/repository-audit/repository.zip HEAD
      - name: Upload repository audit
        uses: actions/upload-artifact@v4
        with:
          name: repository-audit
          path: var/repository-audit
          if-no-files-found: error
          retention-days: 1
