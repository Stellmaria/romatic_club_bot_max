name: Temporary schedule admin formatter

on:
  push:
    branches:
      - fix/userbot-schedule-admin-access

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install development tools
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format and capture diagnostics
        run: |
          set +e
          {
            python -m black userbot/handlers/schedule_admin.py tests/test_schedule_admin_access.py
            echo "BLACK_STATUS=$?"
            python -m ruff check --fix --select E,F,I,B,BLE,ASYNC,S,SIM,UP,C4,PIE,RUF,C90,ARG --ignore S101,S603,S607 userbot/handlers/schedule_admin.py tests/test_schedule_admin_access.py
            echo "RUFF_STATUS=$?"
            git diff -- userbot/handlers/schedule_admin.py tests/test_schedule_admin_access.py
          } > temp_quality_output.txt 2>&1
          cat temp_quality_output.txt
      - name: Commit formatter changes and diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add userbot/handlers/schedule_admin.py tests/test_schedule_admin_access.py temp_quality_output.txt
          git commit -m "Apply project formatting and capture diagnostics"
          git push
