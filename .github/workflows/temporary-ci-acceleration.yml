name: Temporary CI acceleration bootstrap

on:
  push:
    branches: [ci/velvet-style-test-acceleration]

permissions:
  contents: write

concurrency:
  group: temporary-ci-acceleration
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/velvet-style-test-acceleration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Write accelerated CI implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()

          ci = dedent('''\
          name: CI

          on:
            push:
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          env:
            PYTHONUNBUFFERED: "1"
            CI_TEST_SHARDS: "4"
            UV_VERSION: "0.11.16"

          jobs:
            deployment-contract:
              runs-on: ubuntu-latest
              timeout-minutes: 20
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - name: Prepare non-secret Compose environment
                  run: |
                    cp .env.example .env
                    cp .env.bot.example .env.bot
                    cp .env.userbot.example .env.userbot
                    sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_password/' .env
                    sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://auction_bot:ci_only_password@postgres:5432/auction_bot#' .env.bot .env.userbot
                    sed -i 's#^SUPERVISOR_TOKEN_FILE_HOST=.*#SUPERVISOR_TOKEN_FILE_HOST=./.ci-supervisor-token#' .env
                    printf '%s\\n' 'ci-only-supervisor-token-value' > .ci-supervisor-token
                - name: Validate Compose contract
                  run: docker compose config -q
                - name: Set up Docker Buildx
                  uses: docker/setup-buildx-action@v3
                - name: Build production images with shared layer cache
                  uses: docker/bake-action@v6
                  with:
                    files: compose.yaml
                    targets: bot,userbot,supervisor-proxy
                    set: |
                      *.cache-from=type=gha
                      *.cache-to=type=gha,mode=max

            server-supervisor-contract:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install focused test dependencies
                  run: |
                    uv pip install --system \
                      aiogram==3.22.0 \
                      aiohttp==3.12.15 \
                      asyncpg==0.31.0 \
                      pytest==9.0.2 \
                      pytest-asyncio==1.3.0
                - name: Compile Supervisor runtime
                  run: |
                    python -m py_compile \
                      bot/core/supervisor_client.py \
                      bot/handlers/admin/admin_panel_system.py \
                      scripts/server_supervisor.py \
                      scripts/server_supervisor_proxy.py \
                      scripts/hermes_incident_monitor.py
                - name: Validate deployment scripts
                  run: |
                    bash -n deploy/server/deploy.sh
                    bash -n deploy/server/install-server-supervisor.sh
                    bash -n deploy/server/install-hermes-incident-monitor.sh
                - name: Run Supervisor regression contracts
                  env:
                    BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    UID_HASH_KEY: ci-only-hmac-key
                    UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
                  run: |
                    python -m pytest -q \
                      tests/test_process_restart.py \
                      tests/test_admin_system_restart_contract.py \
                      tests/test_server_supervisor_contract.py \
                      tests/test_supervisor_security_boundary.py \
                      tests/test_hermes_incident_monitor_contract.py \
                      tests/test_bid_currency_migration_regression.py::test_deployment_smoke_rejects_restart_loops

            preflight:
              name: preflight
              runs-on: ubuntu-latest
              timeout-minutes: 8
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install locked development dependencies
                  run: uv pip install --system --require-hashes -r requirements.lock
                - name: Verify deterministic shard plan
                  run: python scripts/ci_test_shard.py --total "$CI_TEST_SHARDS" --verify
                - name: Compile Python sources
                  run: python -m compileall -q bot database db userbot main.py config.py fsm_states.py scripts tests
                - name: Build installable wheel
                  run: python -m pip wheel --no-deps --wheel-dir dist .
                - name: Verify installed wheel resources
                  run: |
                    python -m pip install --no-deps --force-reinstall dist/*.whl
                    python -I -c "from db.migrator import _load_migrations; items = _load_migrations(); assert items[-1].filename == '018_utc_timestamp_policy.sql'; assert len({item.version for item in items}) == len(items)"
                    python -I -c "import db.migrations as compatibility; import db.migrator as runtime; assert compatibility.apply_migrations is runtime.apply_migrations; assert compatibility.MIGRATIONS_DIR == runtime.MIGRATIONS_DIR"
                    rm -rf build
                - name: Critical lint checks
                  run: python -m ruff check .
                - name: Persistence exception contract
                  run: python scripts/check_persistence_exceptions.py
                - name: Database boundary contract
                  run: python scripts/check_database_boundaries.py
                - name: Telegram boundary contract
                  run: python scripts/check_telegram_boundary.py
                - name: Handler import boundary contract
                  run: python scripts/check_handler_import_boundaries.py

            test-shards:
              name: test-shard-${{ matrix.shard }}
              runs-on: ubuntu-latest
              timeout-minutes: 10
              strategy:
                fail-fast: true
                matrix:
                  shard: [0, 1, 2, 3]
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                    save-cache: ${{ matrix.shard == 0 }}
                - name: Install locked development dependencies
                  run: uv pip install --system --require-hashes -r requirements.lock
                - name: Run unit and coverage shard
                  env:
                    BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    UID_HASH_KEY: ci-only-hmac-key
                    UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
                    COVERAGE_FILE: .coverage.${{ matrix.shard }}
                  run: |
                    python scripts/ci_test_shard.py \
                      --index "${{ matrix.shard }}" \
                      --total "$CI_TEST_SHARDS" \
                      --failfast \
                      --durations 25
                - name: Upload shard coverage and test results
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: test-coverage-shard-${{ matrix.shard }}
                    path: |
                      .coverage.${{ matrix.shard }}
                      shard-${{ matrix.shard }}.xml
                    if-no-files-found: error
                    retention-days: 7

            test:
              name: test
              if: always()
              needs:
                - preflight
                - test-shards
              runs-on: ubuntu-latest
              timeout-minutes: 2
              steps:
                - name: Verify required test jobs
                  env:
                    PREFLIGHT_RESULT: ${{ needs.preflight.result }}
                    SHARDS_RESULT: ${{ needs.test-shards.result }}
                  run: |
                    test "$PREFLIGHT_RESULT" = "success"
                    test "$SHARDS_RESULT" = "success"

            coverage:
              name: coverage
              if: always()
              needs:
                - test-shards
              runs-on: ubuntu-latest
              timeout-minutes: 6
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install coverage reporter
                  run: uv pip install --system coverage==7.15.3
                - name: Download all shard results
                  uses: actions/download-artifact@v4
                  with:
                    pattern: test-coverage-shard-*
                    path: var/shard-results
                    merge-multiple: true
                - name: Combine coverage and enforce ratchet
                  if: needs.test-shards.result == 'success'
                  run: python scripts/quality.py coverage-report
                - name: Fail when a shard failed
                  if: needs.test-shards.result != 'success'
                  run: exit 1
                - name: Upload combined coverage and duration metrics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: coverage-quality-results
                    path: var/quality
                    if-no-files-found: warn
                    retention-days: 14

            postgres-integration:
              runs-on: ubuntu-latest
              timeout-minutes: 30
              services:
                postgres:
                  image: postgres:17-alpine
                  env:
                    POSTGRES_DB: integration_test
                    POSTGRES_USER: integration
                    POSTGRES_PASSWORD: integration_password
                  ports:
                    - 5432:5432
                  options: >-
                    --health-cmd "pg_isready -U integration -d integration_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install locked development dependencies
                  run: uv pip install --system --require-hashes -r requirements.lock
                - name: Compile integration harness
                  run: |
                    python -m py_compile scripts/run_postgres_integration.py
                    python -m compileall -q tests/integration
                - name: Run PostgreSQL integration suite
                  env:
                    BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    UID_HASH_KEY: ci-only-hmac-key
                    UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
                    TEST_DATABASE_URL: postgresql://integration:integration_password@127.0.0.1:5432/integration_test
                    POSTGRES_INTEGRATION_CONFIRM: "1"
                    POSTGRES_KEEP_FAILED_DATABASES: "1"
                    POSTGRES_INTEGRATION_ARTIFACT_DIR: var/integration-artifacts
                  run: python scripts/quality.py integration
                - name: Collect PostgreSQL failure diagnostics
                  if: failure()
                  env:
                    PGPASSWORD: integration_password
                  run: |
                    mkdir -p var/integration-artifacts
                    container_id="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
                    if [ -n "$container_id" ]; then
                      docker logs "$container_id" > var/integration-artifacts/postgres.log 2>&1 || true
                      docker exec "$container_id" \
                        psql -U integration -d integration_test \
                        -c "SELECT datname, numbackends, xact_commit, xact_rollback, deadlocks FROM pg_stat_database ORDER BY datname" \
                        > var/integration-artifacts/database-stats.txt 2>&1 || true

                      if [ -f var/integration-artifacts/failed-databases.txt ]; then
                        while IFS=$'\\t' read -r database_name nodeid; do
                          [ -n "$database_name" ] || continue
                          docker exec "$container_id" \
                            pg_dump -U integration -d "$database_name" \
                            --schema-only --no-owner --no-privileges \
                            > "var/integration-artifacts/${database_name}.sql" 2>&1 || true
                        done < var/integration-artifacts/failed-databases.txt
                      fi
                    fi
                - name: Upload PostgreSQL diagnostics and metrics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: postgres-integration-results
                    path: |
                      var/integration-artifacts
                      var/quality
                    if-no-files-found: warn
                    retention-days: 14
          ''')

          quality = dedent('''\
          name: Quality Gates

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          defaults:
            run:
              shell: bash

          env:
            UV_VERSION: "0.11.16"

          jobs:
            changed-code-quality:
              name: changed-code-quality
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install locked development dependencies
                  run: uv pip install --system --require-hashes -r requirements.lock
                - name: Run changed-file quality ratchet
                  run: python scripts/quality.py changed

            typing-and-architecture:
              name: typing-and-architecture
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
                  with:
                    version: "0.11.16"
                    enable-cache: true
                    cache-dependency-glob: requirements.lock
                - name: Install locked development dependencies
                  run: uv pip install --system --require-hashes -r requirements.lock
                - name: Run strict package typing ratchet
                  run: python scripts/quality.py typing
                - name: Run architecture gates
                  env:
                    BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                    UID_HASH_KEY: ci-only-hmac-key
                    UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
                  run: python scripts/quality.py architecture
                - name: Upload typing metrics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: typing-ratchet-results
                    path: var/quality/mypy-results.json
                    if-no-files-found: warn
                    retention-days: 14

            security-static:
              name: security-static
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - name: Run security boundary contracts
                  run: python scripts/quality.py security

            branch-protection-contract:
              name: branch-protection-contract
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Verify main required checks
                  env:
                    GH_TOKEN: ${{ github.token }}
                    REPOSITORY: ${{ github.repository }}
                  run: |
                    python - <<'PY_CHECKS'
                    import json
                    import os
                    import urllib.request

                    expected = {
                        "changed-code-quality",
                        "typing-and-architecture",
                        "coverage",
                        "security-static",
                        "deployment-contract",
                        "server-supervisor-contract",
                        "test",
                        "postgres-integration",
                    }
                    request = urllib.request.Request(
                        f"https://api.github.com/repos/{os.environ['REPOSITORY']}/branches/main",
                        headers={
                            "Accept": "application/vnd.github+json",
                            "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                            "X-GitHub-Api-Version": "2022-11-28",
                            "User-Agent": "romatic-club-quality-gates",
                        },
                    )
                    with urllib.request.urlopen(request, timeout=20) as response:
                        branch = json.load(response)
                    if not branch.get("protected"):
                        raise SystemExit("main is not protected")
                    status_checks = branch.get("protection", {}).get("required_status_checks", {})
                    contexts = set(status_checks.get("contexts", []))
                    missing = sorted(expected - contexts)
                    if missing:
                        raise SystemExit("main is missing required checks: " + ", ".join(missing))
                    print("main required checks verified:", ", ".join(sorted(expected)))
                    PY_CHECKS
          ''')

          sharder = dedent('''\
          from __future__ import annotations

          import argparse
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path
          from typing import Sequence

          ROOT = Path(__file__).resolve().parents[1]
          TESTS_ROOT = ROOT / "tests"


          def discover_test_files() -> tuple[Path, ...]:
              """Return every non-integration pytest file handled by matrix shards."""

              return tuple(
                  sorted(
                      path.relative_to(ROOT)
                      for path in TESTS_ROOT.rglob("test_*.py")
                      if path.is_file() and "integration" not in path.relative_to(TESTS_ROOT).parts
                  )
              )


          def partition_test_files(
              files: Sequence[Path],
              *,
              total: int,
          ) -> tuple[tuple[Path, ...], ...]:
              """Balance files deterministically using source size as a stable runtime proxy."""

              if total < 1:
                  raise ValueError("total must be at least 1")
              buckets: list[list[Path]] = [[] for _ in range(total)]
              loads = [0 for _ in range(total)]
              weighted = sorted(
                  files,
                  key=lambda path: (-(ROOT / path).stat().st_size, path.as_posix()),
              )
              for path in weighted:
                  shard = min(range(total), key=lambda index: (loads[index], index))
                  buckets[shard].append(path)
                  loads[shard] += max((ROOT / path).stat().st_size, 1)
              return tuple(tuple(sorted(bucket)) for bucket in buckets)


          def verify_partitions(*, total: int) -> int:
              files = discover_test_files()
              partitions = partition_test_files(files, total=total)
              assigned = [path for partition in partitions for path in partition]
              counts = Counter(assigned)
              duplicates = sorted(path for path, count in counts.items() if count != 1)
              missing = sorted(set(files) - set(assigned))
              empty = [index for index, partition in enumerate(partitions) if not partition]
              if duplicates or missing or empty:
                  print(f"duplicate assignments: {[path.as_posix() for path in duplicates]}")
                  print(f"missing assignments: {[path.as_posix() for path in missing]}")
                  print(f"empty shards: {empty}")
                  return 1
              for index, partition in enumerate(partitions):
                  byte_count = sum((ROOT / path).stat().st_size for path in partition)
                  print(f"shard {index}: {len(partition)} files, {byte_count} source bytes")
              print(f"verified {len(files)} test files across {total} shards")
              return 0


          def run_shard(
              *,
              index: int,
              total: int,
              failfast: bool,
              durations: int,
              list_only: bool,
          ) -> int:
              if not 0 <= index < total:
                  raise ValueError(f"index must be between 0 and {total - 1}")
              selected = partition_test_files(discover_test_files(), total=total)[index]
              if not selected:
                  print(f"shard {index} has no tests", file=sys.stderr)
                  return 2
              print(f"shard {index}/{total - 1}: {len(selected)} test files", flush=True)
              for path in selected:
                  print(path.as_posix(), flush=True)
              if list_only:
                  return 0
              command = [
                  sys.executable,
                  "-m",
                  "pytest",
                  "-q",
                  "-m",
                  "not integration",
                  "--cov=bot",
                  "--cov=db",
                  "--cov=userbot",
                  "--cov-branch",
                  "--cov-report=",
                  f"--junitxml=shard-{index}.xml",
                  "--durations",
                  str(durations),
              ]
              if failfast:
                  command.extend(("--maxfail", "1"))
              command.extend(path.as_posix() for path in selected)
              return subprocess.run(command, cwd=ROOT, check=False).returncode


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description="Run a deterministic pytest shard.")
              parser.add_argument("--index", type=int)
              parser.add_argument("--total", type=int, required=True)
              parser.add_argument("--verify", action="store_true")
              parser.add_argument("--list", action="store_true", dest="list_only")
              parser.add_argument("--failfast", action="store_true")
              parser.add_argument("--durations", type=int, default=25)
              return parser


          def main() -> int:
              args = build_parser().parse_args()
              if args.verify:
                  return verify_partitions(total=args.total)
              if args.index is None:
                  raise SystemExit("--index is required unless --verify is used")
              return run_shard(
                  index=args.index,
                  total=args.total,
                  failfast=args.failfast,
                  durations=args.durations,
                  list_only=args.list_only,
              )


          if __name__ == "__main__":
              raise SystemExit(main())
          ''')

          contract = dedent('''\
          from __future__ import annotations

          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def test_postgres_integration_has_dedicated_ci_job_and_local_runner() -> None:
              workflow = (ROOT / ".github/workflows/ci.yml").read_text(encoding="utf-8")
              integration_runner = (ROOT / "scripts/run_postgres_integration.py").read_text(
                  encoding="utf-8"
              )
              quality_runner = (ROOT / "scripts/quality.py").read_text(encoding="utf-8")

              assert "postgres-integration:" in workflow
              assert "image: postgres:17-alpine" in workflow
              assert 'POSTGRES_INTEGRATION_CONFIRM: "1"' in workflow
              assert "python scripts/quality.py integration" in workflow
              assert "test-shards:" in workflow
              assert "python scripts/ci_test_shard.py" in workflow
              assert "python scripts/quality.py coverage-report" in workflow
              assert "actions/upload-artifact@v4" in workflow
              assert "postgres-integration-results" in workflow
              assert "test-coverage-shard-" in workflow
              assert "uv pip install --system --require-hashes -r requirements.lock" in workflow

              assert 'DEFAULT_IMAGE = "postgres:17-alpine"' in integration_runner
              assert '"POSTGRES_INTEGRATION_CONFIRM": "1"' in integration_runner
              assert '"tests/integration"' in integration_runner
              assert "_dump_failed_databases" in integration_runner

              assert 'pytest_args=("-q", "-m", "integration", "tests/integration")' in quality_runner
              assert "write_test_metrics(junit_path, suite)" in quality_runner
              assert 'totals["flaky_rate_percent"]' in quality_runner
              assert "command_coverage_report" in quality_runner


          def test_parallel_unit_plan_keeps_required_check_names_and_single_execution() -> None:
              workflow = (ROOT / ".github/workflows/ci.yml").read_text(encoding="utf-8")
              quality_workflow = (ROOT / ".github/workflows/quality.yml").read_text(
                  encoding="utf-8"
              )
              sharder = (ROOT / "scripts/ci_test_shard.py").read_text(encoding="utf-8")

              assert "name: test" in workflow
              assert "name: coverage" in workflow
              assert "shard: [0, 1, 2, 3]" in workflow
              assert "coverage-report" not in quality_workflow
              assert "partition_test_files" in sharder
              assert '"not integration"' in sharder
              assert "--cov-branch" in sharder


          def test_all_postgres_scenarios_use_the_explicit_integration_marker() -> None:
              integration_dir = ROOT / "tests/integration"
              scenario_files = sorted(integration_dir.glob("test_*.py"))

              assert scenario_files
              for path in scenario_files:
                  source = path.read_text(encoding="utf-8")
                  assert "pytestmark = pytest.mark.integration" in source, path
                  assert "skipUnless" not in source, path
                  assert "OUTBOX_INTEGRATION_CONFIRM" not in source, path
          ''')

          (root / ".github/workflows/ci.yml").write_text(ci, encoding="utf-8")
          (root / ".github/workflows/quality.yml").write_text(quality, encoding="utf-8")
          (root / "scripts/ci_test_shard.py").write_text(sharder, encoding="utf-8")
          (root / "tests/test_postgres_integration_contract.py").write_text(contract, encoding="utf-8")

          quality_path = root / "scripts/quality.py"
          source = quality_path.read_text(encoding="utf-8")

          metrics_marker = '''def pytest_with_metrics(\n'''
          combined_metrics = '''def write_combined_test_metrics(junit_paths: Sequence[Path], suite: str) -> None:\n    if not junit_paths:\n        raise SystemExit(f"No JUnit files found for {suite}")\n    totals: dict[str, int | float | str] = {\n        "tests": 0,\n        "failures": 0,\n        "errors": 0,\n        "skipped": 0,\n        "seconds": 0.0,\n        "flaky_tests": 0,\n        "suite": suite,\n    }\n    for junit_path in junit_paths:\n        root = ET.parse(junit_path).getroot()\n        suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))\n        totals["tests"] = int(totals["tests"]) + sum(\n            int(item.attrib.get("tests", 0)) for item in suites\n        )\n        totals["failures"] = int(totals["failures"]) + sum(\n            int(item.attrib.get("failures", 0)) for item in suites\n        )\n        totals["errors"] = int(totals["errors"]) + sum(\n            int(item.attrib.get("errors", 0)) for item in suites\n        )\n        totals["skipped"] = int(totals["skipped"]) + sum(\n            int(item.attrib.get("skipped", 0)) for item in suites\n        )\n        totals["seconds"] = float(totals["seconds"]) + sum(\n            float(item.attrib.get("time", 0)) for item in suites\n        )\n        totals["flaky_tests"] = int(totals["flaky_tests"]) + len(\n            root.findall(".//flakyFailure")\n        ) + len(root.findall(".//rerunFailure"))\n    totals["seconds"] = round(float(totals["seconds"]), 3)\n    test_count = int(totals["tests"])\n    flaky = int(totals["flaky_tests"])\n    totals["flaky_rate_percent"] = round((flaky / test_count * 100) if test_count else 0.0, 4)\n    ARTIFACT_DIR.mkdir(parents=True, exist_ok=True)\n    (ARTIFACT_DIR / f"{suite}-metrics.json").write_text(\n        json.dumps(totals, indent=2, sort_keys=True) + "\\n",\n        encoding="utf-8",\n    )\n    print("combined test metrics:", json.dumps(totals, sort_keys=True))\n\n\n'''
          if combined_metrics not in source:
              source = source.replace(metrics_marker, combined_metrics + metrics_marker)

          security_marker = '''def command_security() -> None:\n'''
          coverage_report = '''def command_coverage_report(base: str) -> None:\n    shard_dir = ROOT / "var" / "shard-results"\n    coverage_files = sorted(shard_dir.glob(".coverage.*"))\n    junit_files = sorted(shard_dir.glob("shard-*.xml"))\n    if not coverage_files:\n        raise SystemExit("No shard coverage files found")\n    ARTIFACT_DIR.mkdir(parents=True, exist_ok=True)\n    coverage_path = ARTIFACT_DIR / "coverage.json"\n    run((sys.executable, "-m", "coverage", "combine", str(shard_dir)), timeout=60)\n    run(\n        (sys.executable, "-m", "coverage", "json", "-o", str(coverage_path)),\n        timeout=60,\n    )\n    run(\n        (sys.executable, "-m", "coverage", "report", "--show-missing", "--skip-covered"),\n        timeout=60,\n    )\n    write_combined_test_metrics(junit_files, "unit")\n    payload = load_json(coverage_path)\n    actual = {\n        "overall": float(payload["totals"]["percent_covered"]),\n        "domain_application": coverage_scope_percent(payload),\n    }\n    baseline_path = QUALITY_DIR / "coverage-baseline.json"\n    baseline = load_json(baseline_path)\n    assert_baseline_not_relaxed(\n        current=baseline,\n        previous=base_json(base, baseline_path),\n        keys=("overall", "domain_application"),\n    )\n    (ARTIFACT_DIR / "coverage-results.json").write_text(\n        json.dumps(actual, indent=2, sort_keys=True) + "\\n",\n        encoding="utf-8",\n    )\n    failures = [\n        f"{name}: {value:.2f}% < baseline {float(baseline[name]):.2f}%"\n        for name, value in actual.items()\n        if value + 1e-9 < float(baseline[name])\n    ]\n    print(\n        "coverage ratchet:",\n        ", ".join(f"{name}={value:.2f}%" for name, value in actual.items()),\n    )\n    if failures:\n        raise SystemExit("\\n".join(failures))\n\n\n'''
          if coverage_report not in source:
              source = source.replace(security_marker, coverage_report + security_marker)

          source = source.replace(
              '            "coverage",\n            "security",',
              '            "coverage",\n            "coverage-report",\n            "security",',
          )
          source = source.replace(
              '    elif args.command == "coverage":\n        command_coverage(base)\n    elif args.command == "security":',
              '    elif args.command == "coverage":\n        command_coverage(base)\n    elif args.command == "coverage-report":\n        command_coverage_report(base)\n    elif args.command == "security":',
          )
          quality_path.write_text(source, encoding="utf-8")
          PY
      - name: Generate hash-locked dependency graph
        run: uv pip compile --python-version 3.13 --generate-hashes requirements-dev.txt -o requirements.lock
      - name: Install and validate implementation
        run: |
          uv pip install --system --require-hashes -r requirements.lock
          python -m black scripts/quality.py scripts/ci_test_shard.py tests/test_postgres_integration_contract.py
          python -m ruff check --fix scripts/quality.py scripts/ci_test_shard.py tests/test_postgres_integration_contract.py
          python -m black --check scripts/quality.py scripts/ci_test_shard.py tests/test_postgres_integration_contract.py
          python -m ruff check scripts/quality.py scripts/ci_test_shard.py tests/test_postgres_integration_contract.py
          python scripts/ci_test_shard.py --total 4 --verify
          python -m pytest -q tests/test_postgres_integration_contract.py
      - name: Commit generated implementation and remove bootstrap
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-ci-acceleration.yml
          git add -- \
            .github/workflows/ci.yml \
            .github/workflows/quality.yml \
            requirements.lock \
            scripts/ci_test_shard.py \
            scripts/quality.py \
            tests/test_postgres_integration_contract.py
          git diff --cached --check
          git commit -m "ci: shard tests and combine coverage with uv cache"
          git push origin HEAD:ci/velvet-style-test-acceleration
