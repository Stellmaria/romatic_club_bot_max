name: Issue 30 source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          tar --exclude=.git --exclude='*.tar.gz' -czf "$RUNNER_TEMP/issue30-source.tar.gz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: issue30-source
          path: ${{ runner.temp }}/issue30-source.tar.gz
          if-no-files-found: error
          retention-days: 1
