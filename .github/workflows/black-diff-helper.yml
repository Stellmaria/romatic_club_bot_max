name: Black Diff Helper

on:
  pull_request:
    paths:
      - scripts/hermes_incident_monitor.py
      - .github/workflows/black-diff-helper.yml

permissions:
  contents: write

jobs:
  black-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install formatter
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Apply Black
        run: python -m black scripts/hermes_incident_monitor.py
      - name: Commit formatter result
        shell: bash
        run: |
          if git diff --quiet -- scripts/hermes_incident_monitor.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/hermes_incident_monitor.py
          git commit -m "Apply Black to Hermes incident monitor"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
