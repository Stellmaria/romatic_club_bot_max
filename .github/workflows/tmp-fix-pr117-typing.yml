name: Temporary PR117 Typing Fix

on:
  push:
    branches:
      - feature/open-exchange-and-incomplete-cards

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/open-exchange-and-incomplete-cards
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Apply bounded type-safe conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/handlers/admin/schedule_setup_restart.py')
          source = path.read_text(encoding='utf-8')
          old = '''def _is_positive_int(value: object) -> bool:\n    try:\n        return int(value) > 0\n    except (TypeError, ValueError):\n        return False\n'''
          new = '''def _is_positive_int(value: object) -> bool:\n    if isinstance(value, bool):\n        return False\n    if isinstance(value, int):\n        return value > 0\n    if not isinstance(value, str):\n        return False\n    try:\n        return int(value) > 0\n    except ValueError:\n        return False\n'''
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('expected _is_positive_int block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install pinned quality tools
        run: python -m pip install 'black==26.5.1' 'mypy==1.20.2'
      - name: Validate bounded target
        run: |
          python -m black bot/handlers/admin/schedule_setup_restart.py
          python -m mypy --strict --follow-imports=silent --no-error-summary --namespace-packages --explicit-package-bases bot/handlers/admin/schedule_setup_restart.py
      - name: Commit type fix
        run: |
          if git diff --quiet -- bot/handlers/admin/schedule_setup_restart.py; then
            echo 'typing_change=none'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/handlers/admin/schedule_setup_restart.py
          git commit -m 'fix: parse schedule emoji identifiers type-safely'
          git push origin HEAD:feature/open-exchange-and-incomplete-cards
