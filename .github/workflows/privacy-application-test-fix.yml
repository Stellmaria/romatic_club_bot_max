name: Privacy application lifecycle test fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.ref == 'refs/heads/privacy/approved-temporary-cleanup' &&
      github.event.head_commit.message == 'chore(ci): update privacy application lifecycle test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install pinned development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Update application lifecycle fake
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_application_observability_lifecycle.py')
          text = path.read_text(encoding='utf-8')

          marker = '''    monkeypatch.setattr(
        container_module.ApplicationContainer,
        "build",
        staticmethod(lambda **kwargs: state.update(container_kwargs=kwargs) or object()),
    )
'''
          replacement = '''    def fake_build_container(**kwargs: object) -> SimpleNamespace:
        container = SimpleNamespace(privacy_cleanup=object())
        state["container_kwargs"] = kwargs
        state["container"] = container
        return container

    monkeypatch.setattr(
        container_module.ApplicationContainer,
        "build",
        staticmethod(fake_build_container),
    )
'''
          if marker not in text:
              raise SystemExit('application container fake marker not found')
          text = text.replace(marker, replacement, 1)

          assertion_marker = '''    assert state["metric_calls"] == [("application_starts_total", {"process": "bot"})]
    assert state["events"] == [
'''
          assertion_replacement = '''    assert state["metric_calls"] == [("application_starts_total", {"process": "bot"})]
    task_args, task_kwargs = state["task_specs"]
    assert task_args == (state["protected_bot"],)
    assert task_kwargs["privacy_cleanup"] is state["container"].privacy_cleanup
    assert task_kwargs["metrics"] is state["metrics"]
    assert state["events"] == [
'''
          if assertion_marker not in text:
              raise SystemExit('application lifecycle assertion marker not found')
          path.write_text(text.replace(assertion_marker, assertion_replacement, 1), encoding='utf-8')
          PY
      - name: Validate lifecycle regression
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          python -m black tests/test_application_observability_lifecycle.py
          python -m ruff check tests/test_application_observability_lifecycle.py
          python -m pytest -q tests/test_application_observability_lifecycle.py tests/test_privacy_lifecycle.py tests/test_privacy_cleanup_service.py
          git diff --check
      - name: Commit lifecycle test fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_application_observability_lifecycle.py
          git commit -m 'test(privacy): update application cleanup composition fake'
          git push origin HEAD:privacy/approved-temporary-cleanup
