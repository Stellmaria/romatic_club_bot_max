name: Regenerate complete lock graph

on:
  push:
    branches:
      - "dependabot/pip/requirements/telegram-runtime-303c98910d"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: "dependabot/pip/requirements/telegram-runtime-303c98910d"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Regenerate complete lock graph
        run: scripts/compile_locks.sh requirements
      - name: Commit regenerated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): regenerate complete lock graph"
          git push
