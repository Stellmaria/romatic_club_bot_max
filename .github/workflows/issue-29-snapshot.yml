name: Issue 29 repository snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          excluded = {'.git', '.pytest_cache', '__pycache__', 'dist', 'build'}
          with zipfile.ZipFile('issue-29-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(Path('.').rglob('*')):
                  if not path.is_file():
                      continue
                  if any(part in excluded for part in path.parts):
                      continue
                  archive.write(path, path.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue-29-source
          path: issue-29-source.zip
          if-no-files-found: error
          retention-days: 1
