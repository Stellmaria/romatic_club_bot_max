name: Privacy request fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.ref == 'refs/heads/privacy/request-lifecycle-anonymization' &&
      github.event.head_commit.message == 'chore(ci): fix and format privacy request slice'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install pinned development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Apply reviewed fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/privacy_requests.py')
          text = script.read_text(encoding='utf-8')
          text = text.replace(
              'from bot.core.time import SystemClock\n',
              'from bot.core.settings import DatabaseSettings\nfrom bot.core.time import SystemClock\n',
          )
          text = text.replace(
              'from bot.uid_crypto import configure_uid_crypto\n',
              'from bot.uid_crypto import configure_uid_crypto\nfrom db.pool import DatabaseRuntime\n',
          )
          text = text.replace('    database_url = os.getenv("DATABASE_URL", "").strip()\n', '')
          text = text.replace(
              '    if not database_url or not hash_key or not encryption_key:\n'
              '        raise RuntimeError("DATABASE_URL, UID_HASH_KEY and UID_ENC_KEY are required")\n',
              '    if not hash_key or not encryption_key:\n'
              '        raise RuntimeError("UID_HASH_KEY and UID_ENC_KEY are required")\n',
          )
          text = text.replace(
              '    pool = await asyncpg.create_pool(database_url, min_size=1, max_size=2, command_timeout=30)\n'
              '    try:\n',
              '    runtime = DatabaseRuntime(DatabaseSettings.from_env())\n'
              '    pool = await runtime.start()\n'
              '    try:\n',
          )
          text = text.replace('        await pool.close()\n', '        await runtime.close()\n')
          if 'asyncpg.create_pool' in text:
              raise SystemExit('direct asyncpg pool creation remains')
          script.write_text(text, encoding='utf-8')

          repository = Path('bot/repositories/privacy_requests.py')
          text = repository.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import Any\n',
              'from collections.abc import Mapping\nfrom typing import Any\n',
          )
          text = text.replace('_TERMINAL_APPEAL_STATUSES = ("resolved", "rejected", "closed")\n', '')
          old = '''def _row_to_record(row: asyncpg.Record) -> PrivacyRequestRecord:\n    raw_counts = row["outcome_counts"] or {}\n    return PrivacyRequestRecord(\n'''
          new = '''def _outcome_counts(value: object) -> dict[str, int]:\n    if value is None:\n        return {}\n    decoded: object = json.loads(value) if isinstance(value, str) else value\n    if not isinstance(decoded, Mapping):\n        raise ValueError("privacy outcome_counts must be a JSON object")\n    return {str(key): int(item) for key, item in decoded.items()}\n\n\ndef _row_to_record(row: asyncpg.Record) -> PrivacyRequestRecord:\n    return PrivacyRequestRecord(\n'''
          if old not in text:
              raise SystemExit('record decoder marker not found')
          text = text.replace(old, new)
          text = text.replace(
              '        outcome_counts={str(key): int(value) for key, value in dict(raw_counts).items()},\n',
              '        outcome_counts=_outcome_counts(row["outcome_counts"]),\n',
          )
          repository.write_text(text, encoding='utf-8')

          unit = Path('tests/test_privacy_request_service.py')
          text = unit.read_text(encoding='utf-8')
          text = text.replace(
              '    PrivacyRequestService,\n)\n',
              '    PrivacyRequestService,\n)\nfrom bot.uid_crypto import configure_uid_crypto\n',
          )
          marker = '''@pytest.mark.asyncio\nasync def test_request_self_rejects_cross_subject_and_audits(tmp_path: Path) -> None:\n'''
          replacement = '''@pytest.fixture(autouse=True)\ndef _configure_crypto() -> None:\n    configure_uid_crypto(\n        "privacy-request-test-hmac-key",\n        "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",\n    )\n\n\n@pytest.mark.asyncio\nasync def test_request_self_rejects_cross_subject_and_audits(tmp_path: Path) -> None:\n'''
          if marker not in text:
              raise SystemExit('unit test marker not found')
          unit.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY
      - name: Format and validate targeted slice
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          python -m black \
            bot/services/privacy_requests.py \
            bot/handlers/profile.py \
            tests/integration/test_privacy_request_postgres.py \
            tests/test_privacy_request_service.py \
            bot/repositories/privacy_requests.py \
            scripts/privacy_requests.py
          python -m ruff check \
            bot/services/privacy_requests.py \
            bot/handlers/profile.py \
            tests/integration/test_privacy_request_postgres.py \
            tests/test_privacy_request_service.py \
            bot/repositories/privacy_requests.py \
            scripts/privacy_requests.py
          python scripts/check_database_boundaries.py
          python -m pytest -q tests/test_privacy_request_service.py tests/test_privacy_request_inventory.py
          python -m py_compile scripts/privacy_requests.py bot/repositories/privacy_requests.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bot/services/privacy_requests.py \
            bot/handlers/profile.py \
            tests/integration/test_privacy_request_postgres.py \
            tests/test_privacy_request_service.py \
            bot/repositories/privacy_requests.py \
            scripts/privacy_requests.py
          git commit -m 'fix(privacy): satisfy request lifecycle contracts'
          git push origin HEAD:privacy/request-lifecycle-anonymization
