name: Temporary issue 41 dependency and image refresh

on:
  push:
    branches:
      - security/issue-41-supply-chain

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/issue-41-supply-chain
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.in

      - name: Rebuild deterministic hash locks
        env:
          LOCK_WORK_DIR: /tmp/generated-locks
        run: scripts/compile_locks.sh requirements

      - name: Resolve current official digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            local tag="$1"
            docker pull "$tag" >/dev/null
            local repository_digest
            repository_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")"
            printf '%s@%s\n' "$tag" "${repository_digest#*@}"
          }
          echo "python_slim=$(resolve python:3.13.13-slim)" >> "$GITHUB_OUTPUT"
          echo "python_alpine=$(resolve python:3.13-alpine)" >> "$GITHUB_OUTPUT"
          echo "postgres=$(resolve postgres:17-alpine)" >> "$GITHUB_OUTPUT"

      - name: Update immutable references
        env:
          PYTHON_SLIM: ${{ steps.images.outputs.python_slim }}
          PYTHON_ALPINE: ${{ steps.images.outputs.python_alpine }}
          POSTGRES: ${{ steps.images.outputs.postgres }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          slim = os.environ["PYTHON_SLIM"]
          alpine = os.environ["PYTHON_ALPINE"]
          postgres = os.environ["POSTGRES"]
          postgres_digest = postgres.split("@", 1)[1]
          postgres_short = f"postgres@{postgres_digest}"

          replacements = {
              "Dockerfile": [
                  (r"python:3\.13\.13-slim@sha256:[0-9a-f]{64}", slim),
              ],
              "Dockerfile.server-supervisor-proxy": [
                  (r"python:3\.13-alpine@sha256:[0-9a-f]{64}", alpine),
              ],
              "compose.yaml": [
                  (r"postgres:17-alpine@sha256:[0-9a-f]{64}", postgres),
              ],
              ".env.example": [
                  (r"(?m)^POSTGRES_IMAGE=.*$", f"POSTGRES_IMAGE={postgres}"),
              ],
              "scripts/run_postgres_integration.py": [
                  (r"postgres:17-alpine@sha256:[0-9a-f]{64}", postgres),
              ],
              ".github/workflows/ci.yml": [
                  (r"postgres:17-alpine@sha256:[0-9a-f]{64}", postgres),
                  (r"postgres@sha256:[0-9a-f]{64}", postgres_short),
              ],
              ".github/workflows/quality.yml": [
                  (r"postgres:17-alpine@sha256:[0-9a-f]{64}", postgres),
              ],
              ".github/workflows/security.yml": [
                  (r"postgres:17-alpine@sha256:[0-9a-f]{64}", postgres),
              ],
          }

          for filename, rules in replacements.items():
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              for pattern, replacement in rules:
                  content, count = re.subn(pattern, replacement, content)
                  if count < 1:
                      raise SystemExit(
                          f"{filename}: expected at least one replacement for {pattern}, got {count}"
                      )
              path.write_text(content, encoding="utf-8")

          Path("security/base-image-digests.txt").write_text(
              f"{slim}\n{alpine}\n{postgres}\n",
              encoding="utf-8",
          )
          PY

      - name: Validate generated security inputs
        run: |
          python scripts/check_immutable_references.py
          read -r -a ignores <<< "$(python scripts/check_vulnerability_exceptions.py --format pip-audit)"
          uv pip install --system --require-hashes --no-deps -r requirements/tools.lock
          for lock in requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock; do
            pip-audit --strict --progress-spinner=off --disable-pip --no-deps -r "$lock" "${ignores[@]}"
          done
          cyclonedx-py requirements requirements/tools.lock \
            --output-format JSON \
            --output-file /tmp/tools.cdx.json

      - name: Commit refreshed locks and image pins
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Dockerfile \
            Dockerfile.server-supervisor-proxy \
            compose.yaml \
            .env.example \
            .github/workflows/ci.yml \
            .github/workflows/quality.yml \
            .github/workflows/security.yml \
            requirements/bot.lock \
            requirements/userbot.lock \
            requirements/tools.lock \
            requirements/dev.lock \
            scripts/run_postgres_integration.py \
            security/base-image-digests.txt
          if git diff --cached --quiet; then
            echo 'No dependency or image refresh changes.'
            exit 0
          fi
          git commit -m 'security: refresh patched locks and immutable images'
          git push origin HEAD:security/issue-41-supply-chain
