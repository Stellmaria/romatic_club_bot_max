name: Hotfix Format Artifact

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-transport:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install formatter
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format changed Python files
        run: python -m black bot/handlers/admin/action_support/transport.py tests/test_bot_runtime_dependency_boundary.py
      - name: Commit formatted sources
        run: |
          if git diff --quiet -- bot/handlers/admin/action_support/transport.py tests/test_bot_runtime_dependency_boundary.py; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- bot/handlers/admin/action_support/transport.py tests/test_bot_runtime_dependency_boundary.py
          git commit -m "style: format bot runtime hotfix"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
