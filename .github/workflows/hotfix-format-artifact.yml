name: Hotfix Format Artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install formatter
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format changed Python files
        run: python -m black bot/handlers/admin/action_support/transport.py tests/test_bot_runtime_dependency_boundary.py
      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-hotfix-sources
          path: |
            bot/handlers/admin/action_support/transport.py
            tests/test_bot_runtime_dependency_boundary.py
          if-no-files-found: error
          retention-days: 1
