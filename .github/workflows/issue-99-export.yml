name: Issue 99 workspace export

on:
  push:
    branches:
      - fix/issue-99-deferred-auction-publication

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pack repository snapshot
        run: tar --exclude=.git -czf /tmp/issue-99-workspace.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-99-workspace
          path: /tmp/issue-99-workspace.tar.gz
          retention-days: 1
