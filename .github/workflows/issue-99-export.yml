name: Apply issue 99 implementation

on:
  push:
    branches:
      - fix/issue-99-deferred-auction-publication

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-99-deferred-auction-publication
          persist-credentials: true
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          git apply --check issue99.patch
          git apply issue99.patch
          rm -f issue99.patch docs/issue-99-work-in-progress.md .github/workflows/issue-99-export.yml
      - name: Validate Python syntax
        run: python -m compileall -q bot userbot db
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bot/use_cases/auction_publication.py bot/handlers/auction/publication.py bot/services/auction_workflows.py bot/repositories/auction_workflows.py userbot/services.py db/migrations/019_deferred_auction_publication.sql
          git add -u -- issue99.patch docs/issue-99-work-in-progress.md .github/workflows/issue-99-export.yml
          git commit -m "fix: handle deferred auction publication safely"
          git push origin HEAD:fix/issue-99-deferred-auction-publication
