name: Python 3.14 migration

on:
  push:
    branches:
      - chore/python-3.14-only

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/python-3.14-only
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Rewrite Python runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "Dockerfile": [
                  ("FROM python:3." + "13-slim", "FROM python:3.14-slim"),
              ],
              "Dockerfile.server-supervisor-proxy": [
                  ("FROM python:3." + "13-alpine", "FROM python:3.14-alpine"),
              ],
              "pyproject.toml": [
                  ('requires-python = ">=3.' + '12,<3.14"', 'requires-python = ">=3.14,<3.15"'),
                  ('target-version = "py' + '312"', 'target-version = "py314"'),
                  ('target-version = ["py' + '312"]', 'target-version = ["py314"]'),
              ],
              "README.md": [
                  ("py -3." + "13 -m venv .venv", "py -3.14 -m venv .venv"),
              ],
              "DATABASE_SETUP.md": [
                  ("py -3." + "13 -m venv .venv", "py -3.14 -m venv .venv"),
              ],
              "docs/refactoring/REFACTORING_PHASE_7.md": [
                  ("поддерживает Python 3." + "12–3.14", "поддерживает только Python 3.14"),
              ],
              "docs/worklog/2026-07-30-server-readiness.md": [
                  (
                      "- Первый public CI подтвердил, что Compose deployment-contract собирается на\n"
                      "  Ubuntu. Исправлен `F823` в market management flow: локальный импорт больше\n"
                      "  не shadow-ит service function. Python 3.14 исключён из supported CI matrix\n"
                      "  и package contract: pinned `pydantic-core` не собирается под CPython 3.14\n"
                      "  (PyO3 поддерживает максимум 3." + "13); production target остаётся Python 3." + "13.\n",
                      "- Первый public CI подтвердил, что Compose deployment-contract собирается на\n"
                      "  Ubuntu. Исправлен `F823` в market management flow: локальный импорт больше\n"
                      "  не shadow-ит service function. После обновления dependency contract проект\n"
                      "  переведён на единый production и CI target Python 3.14.\n",
                  ),
              ],
              "bot/handlers/auction_comments.py": [
                  (
                      "    # Python 3.9+ всегда имеет zoneinfo, а у тебя вообще 3." + "13.\n",
                      "    # ZoneInfo входит в стандартную библиотеку поддерживаемого Python.\n",
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text not found in {name}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          text = text.replace('python-version: "3.' + '13"', 'python-version: "3.14"')
          matrix = (
              "    strategy:\n"
              "      fail-fast: false\n"
              "      matrix:\n"
              "        python-version: [\"3." + "12\", \"3." + "13\"]\n"
          )
          if matrix not in text:
              raise SystemExit("expected Python test matrix not found")
          text = text.replace(matrix, "")
          text = text.replace(
              "          python-version: ${{ matrix.python-version }}\n",
              "          python-version: \"3.14\"\n",
          )
          ci.write_text(text, encoding="utf-8")

          Path(".python-version").write_text("3.14\n", encoding="utf-8")

          Path("tests/test_python_runtime_contract.py").write_text(
              '''from __future__ import annotations

import re
from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]


def test_python_314_is_the_only_supported_runtime() -> None:
    pyproject = (ROOT / "pyproject.toml").read_text(encoding="utf-8")
    ci = (ROOT / ".github/workflows/ci.yml").read_text(encoding="utf-8")

    assert 'requires-python = ">=3.14,<3.15"' in pyproject
    assert 'target-version = "py314"' in pyproject
    assert 'target-version = ["py314"]' in pyproject
    assert (ROOT / ".python-version").read_text(encoding="utf-8").strip() == "3.14"
    assert (ROOT / "Dockerfile").read_text(encoding="utf-8").startswith(
        "FROM python:3.14-slim"
    )
    assert (ROOT / "Dockerfile.server-supervisor-proxy").read_text(
        encoding="utf-8"
    ).startswith("FROM python:3.14-alpine")
    assert ci.count('python-version: "3.14"') == 2
    assert "matrix.python-version" not in ci


def test_retired_python_runtime_mentions_do_not_return() -> None:
    forbidden = re.compile(
        r"(?:Python|CPython|python-version:|python:|py\\s+-)\\s*[^\\n]{0,12}3\\.(?:12|13)"
        r"|py(?:312|313)"
    )
    excluded = {
        ROOT / ".github/workflows/python314-upgrade.yml",
    }
    violations: list[str] = []
    for path in ROOT.rglob("*"):
        if not path.is_file() or path in excluded or ".git" in path.parts:
            continue
        if path.suffix.lower() not in {".py", ".md", ".toml", ".yml", ".yaml"} and path.name not in {
            "Dockerfile",
            "Dockerfile.server-supervisor-proxy",
        }:
            continue
        text = path.read_text(encoding="utf-8", errors="ignore")
        if forbidden.search(text):
            violations.append(str(path.relative_to(ROOT)))
    assert not violations, f"retired Python runtime mentions: {violations}"
''',
              encoding="utf-8",
          )
          PY
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Dockerfile Dockerfile.server-supervisor-proxy pyproject.toml .python-version \
            .github/workflows/ci.yml README.md DATABASE_SETUP.md docs bot tests
          git commit -m "chore: require Python 3.14 only"
          git push origin HEAD:chore/python-3.14-only
