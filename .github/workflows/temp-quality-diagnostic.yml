name: Temporary changed quality diagnostic

on:
  push:
    branches:
      - fix/userbot-schedule-admin-access

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install development tools
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Capture changed quality output
        run: |
          set +e
          python scripts/quality.py changed --base origin/main > temp_quality_output.txt 2>&1
          echo "STATUS=$?" >> temp_quality_output.txt
          cat temp_quality_output.txt
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add temp_quality_output.txt
          git commit -m "Capture changed quality diagnostics"
          git push
