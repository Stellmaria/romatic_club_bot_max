name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  deployment-contract:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply exact Ruff fixes
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.1
          python -m ruff check --select I,SIM --fix tests/test_database_schema.py
      - name: Commit schema lint fix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_database_schema.py
          git commit -m 'style: satisfy schema contract lint'
          git push origin "HEAD:$HEAD_REF"
