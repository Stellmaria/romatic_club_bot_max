name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: |
          cp .env.example .env
          cp .env.bot.example .env.bot
          cp .env.userbot.example .env.userbot
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_password/' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://auction_bot:ci_only_password@postgres:5432/auction_bot#' .env.bot .env.userbot
          sed -i 's#^SUPERVISOR_TOKEN_FILE_HOST=.*#SUPERVISOR_TOKEN_FILE_HOST=./.ci-supervisor-token#' .env
          printf '%s\n' 'ci-only-supervisor-token-value' > .ci-supervisor-token
      - name: Validate Compose contract
        run: docker compose config -q
      - name: Build production images
        run: docker compose build bot userbot supervisor-proxy

  server-supervisor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            aiogram==3.22.0 \
            aiohttp==3.12.15 \
            asyncpg==0.30.0 \
            pytest==9.0.2 \
            pytest-asyncio==1.3.0
      - name: Compile Supervisor runtime
        run: |
          python -m py_compile \
            bot/core/supervisor_client.py \
            bot/handlers/admin/admin_panel_system.py \
            scripts/server_supervisor.py \
            scripts/server_supervisor_proxy.py \
            scripts/hermes_incident_monitor.py
      - name: Validate deployment scripts
        run: |
          bash -n deploy/server/deploy.sh
          bash -n deploy/server/install-server-supervisor.sh
          bash -n deploy/server/install-hermes-incident-monitor.sh
      - name: Run Supervisor regression contracts
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          python -m pytest -q \
            tests/test_process_restart.py \
            tests/test_admin_system_restart_contract.py \
            tests/test_server_supervisor_contract.py \
            tests/test_supervisor_security_boundary.py \
            tests/test_hermes_incident_monitor_contract.py \
            tests/test_bid_currency_migration_regression.py::test_deployment_smoke_rejects_restart_loops

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q bot database db userbot main.py config.py fsm_states.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel resources
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I -c "from db.migrator import _load_migrations; items = _load_migrations(); assert items[-1].filename == '016_auction_processing_leases.sql'; assert len({item.version for item in items}) == len(items)"
          python -I -c "import db.migrations as compatibility; import db.migrator as runtime; assert compatibility.apply_migrations is runtime.apply_migrations; assert compatibility.MIGRATIONS_DIR == runtime.MIGRATIONS_DIR"
      - name: Remove wheel build artifacts before source checks
        run: rm -rf build
      - name: Critical lint checks
        run: python -m ruff check .
      - name: Persistence exception contract
        run: python scripts/check_persistence_exceptions.py
      - name: Database boundary contract
        run: python scripts/check_database_boundaries.py
      - name: Telegram boundary contract
        run: python scripts/check_telegram_boundary.py
      - name: Handler import boundary contract
        run: python scripts/check_handler_import_boundaries.py
      - name: Unit and regression tests
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: python -m pytest -q -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile integration harness
        run: |
          python -m py_compile scripts/run_postgres_integration.py
          python -m compileall -q tests/integration
      - name: Run PostgreSQL integration suite
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          TEST_DATABASE_URL: postgresql://integration:integration_password@127.0.0.1:5432/integration_test
          POSTGRES_INTEGRATION_CONFIRM: "1"
          POSTGRES_KEEP_FAILED_DATABASES: "1"
          POSTGRES_INTEGRATION_ARTIFACT_DIR: var/integration-artifacts
        run: python -m pytest -q -m integration tests/integration
      - name: Collect PostgreSQL failure diagnostics
        if: failure()
        env:
          PGPASSWORD: integration_password
        run: |
          mkdir -p var/integration-artifacts
          container_id="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n 1)"
          if [ -n "$container_id" ]; then
            docker logs "$container_id" > var/integration-artifacts/postgres.log 2>&1 || true
            docker exec "$container_id" \
              psql -U integration -d integration_test \
              -c "SELECT datname, numbackends, xact_commit, xact_rollback, deadlocks FROM pg_stat_database ORDER BY datname" \
              > var/integration-artifacts/database-stats.txt 2>&1 || true

            if [ -f var/integration-artifacts/failed-databases.txt ]; then
              while IFS=$'\t' read -r database_name nodeid; do
                [ -n "$database_name" ] || continue
                docker exec "$container_id" \
                  pg_dump -U integration -d "$database_name" \
                  --schema-only --no-owner --no-privileges \
                  > "var/integration-artifacts/${database_name}.sql" 2>&1 || true
              done < var/integration-artifacts/failed-databases.txt
            fi
          fi
      - name: Upload PostgreSQL diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-diagnostics
          path: var/integration-artifacts
          if-no-files-found: warn
          retention-days: 14
