name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-admin-navigation-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/complete-admin-navigation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Verify and apply audited patch
        run: |
          test -f .admin-audit-gz/part-10.b64
          cat .admin-audit-gz/part-*.b64 > /tmp/admin-audit.patch.gz.b64
          base64 -d /tmp/admin-audit.patch.gz.b64 > /tmp/admin-audit.patch.gz
          gzip -t /tmp/admin-audit.patch.gz
          gzip -dc /tmp/admin-audit.patch.gz > /tmp/admin-audit.patch
          echo "26fbc3caf8e04363b06a7b4f0c74732528cfe0ecf10ad9ee7b74cb74795730ee  /tmp/admin-audit.patch" | sha256sum -c -
          git apply --3way /tmp/admin-audit.patch
          rm -rf .admin-audit .admin-audit-gz
          rm -f .github/workflows/apply-admin-navigation-audit.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить аудит навигации админ-панели"
          git push origin HEAD:${{ github.head_ref }}

  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret Compose environment
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci_only_password/' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://auction_bot:ci_only_password@postgres:5432/auction_bot#' .env
      - name: Validate Compose contract
        run: docker compose config -q
      - name: Build production images
        run: docker compose build bot userbot supervisor-proxy

  server-supervisor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install aiogram==3.22.0 aiohttp==3.12.15 pytest==9.0.2
      - name: Compile Supervisor runtime
        run: |
          python -m py_compile \
            bot/core/supervisor_client.py \
            bot/handlers/admin/admin_panel_system.py \
            scripts/server_supervisor.py \
            scripts/server_supervisor_proxy.py
      - name: Validate deployment scripts
        run: |
          bash -n deploy/server/deploy.sh
          bash -n deploy/server/install-server-supervisor.sh
      - name: Run Supervisor regression contracts
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          python -m pytest -q \
            tests/test_process_restart.py \
            tests/test_admin_system_restart_contract.py \
            tests/test_server_supervisor_contract.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q bot database db userbot main.py config.py fsm_states.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel resources
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I -c "from db.migrations import migration_files; assert len(migration_files()) >= 7"
      - name: Remove wheel build artifacts before source checks
        run: rm -rf build
      - name: Critical lint checks
        run: python -m ruff check .
      - name: Unit and regression tests
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: python -m pytest -q
