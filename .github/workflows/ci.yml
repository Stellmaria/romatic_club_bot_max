name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  deployment-contract:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
      - name: Split Telethon snapshot responsibilities
        env:
          SNAPSHOT_FUNCTIONS_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('deploy/server/deploy.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'session_snapshot_created=0\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected session snapshot state marker')
          text = text.replace(marker, marker + 'session_file_exists=0\n', 1)
          start = text.index('snapshot_userbot_session() {\n')
          end = text.index('\nrestore_userbot_session() {', start)
          replacement = base64.b64decode(os.environ['SNAPSHOT_FUNCTIONS_B64']).decode()
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          PY
          bash -n deploy/server/deploy.sh
      - name: Regenerate deterministic dependency locks
        run: |
          rm -rf generated-locks /tmp/generated-locks
          scripts/compile_locks.sh generated-locks
          for group in bot userbot tools dev; do
            cp "generated-locks/$group.lock" "requirements/$group.lock"
          done
      - name: Commit bounded fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/server/deploy.sh requirements/*.lock
          git commit -m 'fix: split snapshot flow and refresh dependency locks'
          git push origin "HEAD:$HEAD_REF"
