name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q bot database db userbot main.py config.py fsm_states.py
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel resources
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -I -c "from db.migrations import migration_files; assert len(migration_files()) >= 7"
      - name: Critical lint checks
        run: python -m ruff check .
      - name: Unit and regression tests
        run: python -m pytest -q
