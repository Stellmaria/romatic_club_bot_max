name: Privacy Black Format

on:
  push:
    branches:
      - feat/issue-45-privacy-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  black-format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-45-privacy-foundation
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format bounded file
        run: |
          python -m black scripts/privacy_cleanup.py
          git diff --check
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- scripts/privacy_cleanup.py; then
            echo "black_format=no_changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/privacy_cleanup.py
          git commit -m "style: apply Black to privacy cleanup refactor"
          git push origin HEAD:feat/issue-45-privacy-foundation
