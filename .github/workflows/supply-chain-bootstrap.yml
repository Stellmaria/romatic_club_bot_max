name: Supply Chain Bootstrap

on:
  pull_request:
    paths:
      - "requirements/*.in"
      - ".github/workflows/supply-chain-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v6
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Compile hashed lock files
        run: |
          mkdir -p generated
          for group in bot userbot tools dev; do
            uv pip compile \
              --python-version 3.13 \
              --generate-hashes \
              --no-emit-index-url \
              --output-file "generated/${group}.lock" \
              "requirements/${group}.in"
          done
      - name: Resolve immutable base image references
        run: |
          for image in python:3.13.13-slim python:3.13-alpine postgres:17-alpine; do
            docker pull "$image" >/dev/null
            docker image inspect "$image" --format '{{index .RepoDigests 0}}'
          done | tee generated/base-image-digests.txt
      - name: Commit generated supply-chain files
        run: |
          cp generated/*.lock requirements/
          mkdir -p security
          cp generated/base-image-digests.txt security/base-image-digests.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock security/base-image-digests.txt
          if git diff --cached --quiet; then
            echo "Generated files are current"
          else
            git commit -m "build(deps): generate hashed service lock files"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Package source snapshot
        run: git archive --format=tar.gz --output generated/source.tar.gz HEAD
      - name: Upload generated inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-bootstrap
          path: generated
          if-no-files-found: error
          retention-days: 3
