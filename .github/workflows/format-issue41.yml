name: Format Issue 41

on:
  pull_request:
    paths:
      - ".github/workflows/format-issue41.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install hashed development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format and validate changed Python
        run: |
          files=(
            bot/core/settings.py
            bot/tools/refresh_users.py
            scripts/check_dependency_licenses.py
            scripts/check_immutable_references.py
            scripts/check_vulnerability_exceptions.py
            scripts/migrate_uid_encryption.py
            tests/test_python_runtime_contract.py
            tests/test_uid_key_rotation.py
          )
          python -m black "${files[@]}"
          python -m ruff check "${files[@]}"
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bot/core/settings.py \
            bot/tools/refresh_users.py \
            scripts/check_dependency_licenses.py \
            scripts/check_immutable_references.py \
            scripts/check_vulnerability_exceptions.py \
            scripts/migrate_uid_encryption.py \
            tests/test_python_runtime_contract.py \
            tests/test_uid_key_rotation.py
          if git diff --cached --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git commit -m "style: format supply-chain changes"
          git push origin "HEAD:${{ github.head_ref }}"
