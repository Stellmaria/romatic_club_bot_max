name: Apply Time Policy Fixes

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-37-time-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Download validated patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8860832324/zip" \
            --output /tmp/time-policy-fixes.zip
          rm -rf /tmp/time-policy-fixes
          mkdir -p /tmp/time-policy-fixes
          unzip -q /tmp/time-policy-fixes.zip -d /tmp/time-policy-fixes
          cp -a /tmp/time-policy-fixes/time-policy-ruff-fixes/. .
      - name: Add coverage regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_time_boundaries.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from bot.application_models import AuctionRecord\n",
              "from bot.application_models import (\n"
              "    AuctionRecord,\n"
              "    ModerationStatus,\n"
              "    OutboxRecord,\n"
              "    ScheduleLotRecord,\n"
              "    UidVerificationRecord,\n"
              ")\n",
          )
          test = '''

          def test_all_persisted_record_timestamps_normalize_to_utc() -> None:
              source = datetime(2026, 8, 3, 16, 30, tzinfo=timezone(timedelta(hours=3)))

              auction = AuctionRecord(
                  auction_id=2,
                  status="scheduled",
                  auction_kind=AuctionKind.STANDARD,
                  currency=Currency.DIAMONDS,
                  start_price=100,
                  end_time=source,
              )
              lot = ScheduleLotRecord(
                  auction_id=2,
                  target_date=source.date(),
                  start_time=source,
                  end_time=source + timedelta(minutes=30),
                  card_name="Test card",
                  auction_kind=AuctionKind.STANDARD,
              )
              verification = UidVerificationRecord(
                  request_id=3,
                  user_id=4,
                  status=ModerationStatus.PENDING,
                  uid_hash="hash",
                  created_at=source,
              )
              outbox = OutboxRecord(
                  event_id=5,
                  event_type="test",
                  aggregate_id="2",
                  payload_json="{}",
                  created_at=source,
                  attempts=0,
              )

              expected = datetime(2026, 8, 3, 13, 30, tzinfo=UTC)
              assert auction.end_time == expected
              assert lot.start_time == expected
              assert lot.end_time == expected + timedelta(minutes=30)
              assert verification.created_at == expected
              assert outbox.created_at == expected
          '''
          test = "\n".join(line[10:] if line.startswith("          ") else line for line in test.splitlines())
          if "test_all_persisted_record_timestamps_normalize_to_utc" not in text:
              text += test + "\n"
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate final source
        shell: bash
        env:
          BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          UID_HASH_KEY: ci-only-hmac-key
          UID_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          set -euo pipefail
          files=(
            bot/application_models.py
            bot/application_ports.py
            bot/bootstrap/container.py
            bot/core/time.py
            bot/domain/auctions/models.py
            bot/repositories/auction_workflows.py
            bot/telegram/callback_parser.py
            bot/use_cases/auction_moderation.py
            scripts/check_time_policy.py
            scripts/quality.py
            tests/integration/test_migrations_postgres.py
            tests/test_auction_domain.py
            tests/test_phase5_time.py
            tests/test_runtime_schedule_migration.py
            tests/test_time_boundaries.py
            tests/test_time_policy_checker.py
          )
          python -m black "${files[@]}"
          python -m ruff check \
            --select E,F,I,B,BLE,ASYNC,S,SIM,UP,C4,PIE,RUF,C90,ARG \
            --ignore S101,S603,S607 \
            "${files[@]}"
          python scripts/check_time_policy.py
          python -m pytest -q -m 'not integration'
          python scripts/quality.py coverage
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -- .github/workflows/export-time-policy-ruff-fixes.yml
          git add -- \
            bot/application_models.py \
            bot/application_ports.py \
            bot/bootstrap/container.py \
            bot/core/time.py \
            bot/domain/auctions/models.py \
            bot/repositories/auction_workflows.py \
            bot/telegram/callback_parser.py \
            bot/use_cases/auction_moderation.py \
            scripts/check_time_policy.py \
            scripts/quality.py \
            tests/integration/test_migrations_postgres.py \
            tests/test_auction_domain.py \
            tests/test_phase5_time.py \
            tests/test_runtime_schedule_migration.py \
            tests/test_time_boundaries.py \
            tests/test_time_policy_checker.py
          git commit -m "fix(time): satisfy quality and coverage gates"
          git push origin HEAD:codex/issue-37-time-policy
