name: Lock Refresh Diagnostic

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compile-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Compile and commit current lock graph
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir generated-locks
          scripts/compile_locks.sh generated-locks
          cp generated-locks/*.lock requirements/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock
          if git diff --cached --quiet; then
            echo "Dependency locks are already current"
          else
            git commit -m "build: refresh reproducible dependency locks"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
