name: Security Evidence

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-evidence-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dependency-evidence:
    name: dependency-evidence (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [bot, userbot, tools, dev]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install hashed evidence tooling
        run: uv pip install --system --require-hashes --no-deps -r requirements/tools.lock
      - name: Generate CycloneDX dependency SBOM
        run: |
          mkdir -p evidence
          cyclonedx-py requirements requirements/${{ matrix.group }}.lock \
            --output-format JSON \
            --output-file evidence/python-${{ matrix.group }}.cdx.json
      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-evidence-${{ matrix.group }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  image-evidence:
    name: image-evidence (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [bot, userbot, supervisor]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build OCI image with BuildKit SBOM and provenance attestations
        env:
          SERVICE: ${{ matrix.service }}
          BUILDX_METADATA_PROVENANCE: max
          BUILDX_METADATA_WARNINGS: "true"
        run: |
          mkdir -p evidence
          case "$SERVICE" in
            bot)
              dockerfile=Dockerfile
              build_args=(--build-arg REQUIREMENTS_LOCK=requirements/bot.lock)
              ;;
            userbot)
              dockerfile=Dockerfile
              build_args=(--build-arg REQUIREMENTS_LOCK=requirements/userbot.lock)
              ;;
            supervisor)
              dockerfile=Dockerfile.server-supervisor-proxy
              build_args=()
              ;;
            *) exit 2 ;;
          esac
          docker buildx build \
            --pull=false \
            --file "$dockerfile" \
            "${build_args[@]}" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "evidence/${SERVICE}-provenance.json" \
            --output "type=oci,dest=evidence/${SERVICE}.oci.tar" \
            .
      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          input: evidence/${{ matrix.service }}.oci.tar
          format: cyclonedx
          output: evidence/${{ matrix.service }}-image.cdx.json
      - name: Remove bulky OCI transport after evidence extraction
        run: rm -f "evidence/${{ matrix.service }}.oci.tar"
      - name: Upload image SBOM and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-evidence-${{ matrix.service }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  postgres-evidence:
    name: postgres-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build hardened PostgreSQL image
        run: docker build --pull=false --file Dockerfile.postgres --tag "romatic-postgres:${GITHUB_SHA}" .
      - name: Generate PostgreSQL image SBOM
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          image-ref: romatic-postgres:${{ github.sha }}
          format: cyclonedx
          output: postgres-image.cdx.json
      - name: Upload PostgreSQL SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-evidence-postgres
          path: postgres-image.cdx.json
          if-no-files-found: error
          retention-days: 90
