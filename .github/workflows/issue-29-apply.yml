name: Apply issue 29 refactor

on:
  push:
    branches:
      - refactor/issue-29-admin-boundaries

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-29-admin-boundaries
          fetch-depth: 0
      - name: Reassemble and validate patch
        run: |
          set -euo pipefail
          test "$(find .github/issue29-patch -maxdepth 1 -type f -name 'part*' | wc -l)" -eq 14
          cat .github/issue29-patch/part* | base64 --decode | gzip --decompress > /tmp/issue29.patch
          git apply --check /tmp/issue29.patch
          git apply --index /tmp/issue29.patch
      - name: Validate source boundaries
        run: |
          python -m compileall -q bot database db userbot main.py config.py fsm_states.py tests scripts
          python scripts/check_handler_import_boundaries.py
      - name: Commit refactor and remove transport
        run: |
          set -euo pipefail
          git rm -r .github/issue29-patch .github/workflows/issue-29-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(admin): enforce explicit handler feature boundaries"
          git push origin HEAD:refactor/issue-29-admin-boundaries
