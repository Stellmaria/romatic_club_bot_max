name: Apply issue 29 refactor

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-29-admin-boundaries
          fetch-depth: 0
      - name: Reassemble and validate patch
        run: |
          set -euo pipefail
          count="$(find .github/issue29-patch -maxdepth 1 -type f -name 'part*' | wc -l)"
          echo "patch parts: ${count}"
          test "${count}" -eq 14
          cat > /tmp/part-checksums <<'EOF'
          df05b5d41312eb877305a76a9f60e3ed37ce8ee1679bf4062b37addddc479378  .github/issue29-patch/part00
          e59cb5f170fc91169047b6d56762d9390dfcb8cc976d6519633ccb3aa522c323  .github/issue29-patch/part01
          61f550b3e72c504166f022cc570aeda2d402074feb2837dc8850566bb95c9be7  .github/issue29-patch/part02
          91c06d1713105d9ec79324998fdbf7262b9ea7a74d34c3d4a6cdde82d6b2550e  .github/issue29-patch/part03
          340bd0b430a0e6f10afe59eda3a4ea69dd645ed4196601701c5143731de8da1c  .github/issue29-patch/part04
          6e9f7b275261a565f8ca4e68e835b87b019b54535e3ff252490f55745a9b158a  .github/issue29-patch/part05
          0126ed3714a33c0c0a25baf09e1d5091c41df50c192932bcc91f1c8aea130fa6  .github/issue29-patch/part06
          2c1efb2bfd8e6fe4aa5bd7a33f796a6f146709ace7ff0b4d35d54558ddf23e4d  .github/issue29-patch/part07
          1b855566f4833599d865dabca58ab14d301957532553c7f4c7564e5132e4c963  .github/issue29-patch/part08
          70b0018233bb01095f7376db3498ba7554ae97d321015df462d81c4ca33848a4  .github/issue29-patch/part09
          60007429995ff5f34a986fc446a19d61f3b75d1188f1dca0156c8eeeb1ac30e9  .github/issue29-patch/part10
          95f499a822b76399b4ffd2da7345e2e8c6fef50b6d62d401af4dc1d55c242900  .github/issue29-patch/part11
          1f5ab940e24ef27a5a48c848b88734b6576e489de4d993afc577d635c8167eb1  .github/issue29-patch/part12
          57ba9939be4e2972453d4b8c0ac6ecfe4936d4e46bfa23a71d589b0ee716091b  .github/issue29-patch/part13
          EOF
          sha256sum --check /tmp/part-checksums
          cat .github/issue29-patch/part* > /tmp/issue29.patch.gz.b64
          echo 'a23a705c5b32b4827397650b064213e8a4b0e9093732ce8c9710c1c2f3a56d2b  /tmp/issue29.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/issue29.patch.gz.b64 > /tmp/issue29.patch.gz
          echo '2a2d6ef43401eecc8d69ee4e8d1104d24d9bb13450c6f89c7cdd56ce5c21fdc9  /tmp/issue29.patch.gz' | sha256sum --check
          gzip --test /tmp/issue29.patch.gz
          gzip --decompress --stdout /tmp/issue29.patch.gz > /tmp/issue29.patch
          echo '73267629b13229a7441fbdddca9d3cb932eee0b50dd4976fa420d80a4286dfb4  /tmp/issue29.patch' | sha256sum --check
          git apply --check /tmp/issue29.patch
          git apply --index /tmp/issue29.patch
      - name: Validate source boundaries
        run: |
          python -m compileall -q bot database db userbot main.py config.py fsm_states.py tests scripts
          python scripts/check_handler_import_boundaries.py
      - name: Commit code refactor
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows/ci.yml .github/workflows/issue-29-snapshot.yml
          git rm -r .github/issue29-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(admin): enforce explicit handler feature boundaries"
          git push origin HEAD:refactor/issue-29-admin-boundaries
