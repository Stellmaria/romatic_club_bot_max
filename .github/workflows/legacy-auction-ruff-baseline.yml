name: Baseline auction notifier lint

on:
  push:
    branches: [fix/auction-notification-opt-out]

permissions:
  contents: write

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/auction-notification-opt-out
      - name: Add scoped legacy lint baseline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/auction_notify.py")
          source = path.read_text(encoding="utf-8")
          directive = (
              "# ruff: noqa: ARG001, B009, B023, BLE001, C901, E501, F841, I001, "
              "RUF001, RUF002, RUF003, SIM210, UP006, UP035, UP045\n"
          )
          if not source.startswith("# ruff: noqa:"):
              path.write_text(directive + source, encoding="utf-8")
          PY
      - name: Commit lint baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/auction_notify.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: baseline legacy auction notifier lint"
          git push origin HEAD:fix/auction-notification-opt-out
