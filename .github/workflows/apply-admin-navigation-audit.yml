name: Apply admin navigation audit

on:
  push:
    branches:
      - agent/complete-admin-navigation-audit
    paths:
      - ".admin-audit-gz/**"
      - ".github/workflows/apply-admin-navigation-audit.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply audited patch
        run: |
          cat .admin-audit-gz/part-*.b64 > /tmp/admin-audit.patch.gz.b64
          echo "31fe524a8705535b8ac1e22e675783df9d3436b129634153d8084f21bfcbb539  /tmp/admin-audit.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/admin-audit.patch.gz.b64 > /tmp/admin-audit.patch.gz
          echo "e66644c9310e6bc58436cd5a0413f80afb660df23d5ed99a636a58bba0278c20  /tmp/admin-audit.patch.gz" | sha256sum -c -
          gzip -dc /tmp/admin-audit.patch.gz > /tmp/admin-audit.patch
          echo "03b206a65ef6c25ac15a9881bb285e382c659fa21505109bc07b6bde1fad251d  /tmp/admin-audit.patch" | sha256sum -c -
          git apply --3way /tmp/admin-audit.patch
          rm -rf .admin-audit .admin-audit-gz
          rm -f .github/workflows/apply-admin-navigation-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Завершить аудит навигации админ-панели"
          git push
