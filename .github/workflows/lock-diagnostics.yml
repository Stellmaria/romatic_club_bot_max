name: Lock Diagnostics

on:
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  refresh-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Refresh reproducible locks
        run: scripts/compile_locks.sh requirements
      - name: Commit refreshed locks when needed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock; then
            echo "Locks already reproducible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock
          git commit -m "Refresh reproducible dependency locks"
          git push origin "HEAD:${BRANCH}"
