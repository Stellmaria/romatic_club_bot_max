name: Temporary PR117 Formatter

on:
  push:
    branches:
      - feature/open-exchange-and-incomplete-cards

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/open-exchange-and-incomplete-cards
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install pinned formatter
        run: python -m pip install 'black==26.5.1'
      - name: Format bounded target
        run: python -m black bot/handlers/admin/schedule_setup_restart.py
      - name: Commit formatting result
        run: |
          if git diff --quiet -- bot/handlers/admin/schedule_setup_restart.py; then
            echo 'formatter_change=none'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/handlers/admin/schedule_setup_restart.py
          git commit -m 'style: format schedule diagnostics'
          git push origin HEAD:feature/open-exchange-and-incomplete-cards
