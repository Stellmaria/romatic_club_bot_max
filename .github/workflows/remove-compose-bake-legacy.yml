name: Remove legacy Compose builder override

on:
  push:
    branches:
      - fix/remove-compose-bake-legacy-override

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Remove deprecated COMPOSE_BAKE override')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove deprecated override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('deploy/server/deploy.sh')
          text = path.read_text(encoding='utf-8')
          old = 'export COMPOSE_BAKE=false\n'
          if old not in text:
              raise SystemExit('legacy COMPOSE_BAKE override not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          bash -n deploy/server/deploy.sh
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/server/deploy.sh
          git commit -m 'Remove deprecated COMPOSE_BAKE override'
          git push origin HEAD:fix/remove-compose-bake-legacy-override
