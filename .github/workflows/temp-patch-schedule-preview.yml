name: Temporary schedule preview patch

on:
  push:
    branches:
      - fix/schedule-preview-graceful-degradation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/schedule-preview-graceful-degradation
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Capture patch diagnostics
        run: |
          set +e
          {
            python scripts/temp_patch_schedule_preview.py
            black \
              userbot/schedule_publication.py \
              userbot/schedule_review_service.py \
              userbot/handlers/schedule_admin.py \
              tests/test_schedule_admin_access.py \
              tests/test_schedule_preview_graceful_degradation.py
            pytest -q \
              tests/test_schedule_admin_access.py \
              tests/test_schedule_preview_graceful_degradation.py
          } > temp_patch_output.txt 2>&1
          status=$?
          echo "STATUS=$status" >> temp_patch_output.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp_patch_output.txt
          git commit -m "Capture schedule preview patch diagnostics"
          git push origin HEAD:fix/schedule-preview-graceful-degradation
