name: Temporary Black formatter PR87

on:
  push:
    branches: [ci/velvet-style-test-acceleration]

permissions:
  contents: write

concurrency:
  group: temporary-black-pr87
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/velvet-style-test-acceleration
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Format and validate exact files
        run: |
          uv pip install --system black==25.11.0 ruff==0.14.7
          python -m black \
            tests/test_python_runtime_contract.py \
            tests/test_postgres_integration_contract.py
          python -m black --check \
            tests/test_python_runtime_contract.py \
            tests/test_postgres_integration_contract.py
          python -m ruff check \
            tests/test_python_runtime_contract.py \
            tests/test_postgres_integration_contract.py
      - name: Commit formatted files and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temporary-black-pr87.yml
          git add -- \
            tests/test_python_runtime_contract.py \
            tests/test_postgres_integration_contract.py
          git diff --cached --check
          git commit -m "style(ci): format workflow contract tests"
          git push origin HEAD:ci/velvet-style-test-acceleration
