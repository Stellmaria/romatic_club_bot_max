name: Issue44 Snapshot and Lock Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  changed-code-quality:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
      - name: Split Telethon snapshot responsibilities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('deploy/server/deploy.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'session_snapshot_created=0\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected session snapshot state marker')
          text = text.replace(marker, marker + 'session_file_exists=0\n', 1)

          start = text.index('snapshot_userbot_session() {\n')
          end = text.index('\nrestore_userbot_session() {', start)
          replacement = r'''probe_userbot_session() {
  local probe_status

  session_file_exists=0
  if "${compose[@]}" run --rm -T --no-deps \
    --user "$app_uid:$app_gid" userbot python - <<'PY'
from pathlib import Path

raise SystemExit(
    0
    if Path("/run/romatic-userbot-session/userbot.session").is_file()
    else 44
)
PY
  then
    session_file_exists=1
    return 0
  fi

  probe_status="$?"
  if [[ "$probe_status" == "44" ]]; then
    echo "Userbot session file is absent; compatibility probe skipped."
    return 0
  fi
  return "$probe_status"
}

write_userbot_session_snapshot() {
  local snapshot_tmp="$1"

  "${compose[@]}" run --rm -T --no-deps \
    --user "$app_uid:$app_gid" \
    -e ROMATIC_EXPECTED_APP_UID="$app_uid" \
    -e ROMATIC_EXPECTED_APP_GID="$app_gid" \
    userbot python - <<'PY' >"$snapshot_tmp"
import os
import sqlite3
import stat
import sys
from pathlib import Path

source_path = Path("/run/romatic-userbot-session/userbot.session")
target_path = Path("/tmp/userbot-session-snapshot.session")
expected_uid = int(os.environ["ROMATIC_EXPECTED_APP_UID"])
expected_gid = int(os.environ["ROMATIC_EXPECTED_APP_GID"])
source_stat = source_path.stat()
source_mode = stat.S_IMODE(source_stat.st_mode)
if source_stat.st_uid != expected_uid or source_stat.st_gid != expected_gid:
    raise RuntimeError(
        f"Unexpected Telethon session owner: {source_stat.st_uid}:{source_stat.st_gid}; "
        f"expected {expected_uid}:{expected_gid}"
    )
if source_mode & 0o077:
    raise RuntimeError(f"Telethon session permissions are too broad: {source_mode:04o}")

target_path.unlink(missing_ok=True)
source = sqlite3.connect(f"file:{source_path}?mode=ro", uri=True)
target = sqlite3.connect(target_path)
try:
    source.backup(target)
    result = target.execute("PRAGMA quick_check").fetchone()
    if result != ("ok",):
        raise RuntimeError(f"Telethon session quick_check failed: {result!r}")
finally:
    target.close()
    source.close()

sys.stdout.buffer.write(target_path.read_bytes())
target_path.unlink(missing_ok=True)
PY
}

verify_userbot_session_snapshot() {
  local snapshot_tmp="$1"

  python3 - "$snapshot_tmp" <<'PY'
import sqlite3
import sys
from pathlib import Path

snapshot_path = Path(sys.argv[1])
if not snapshot_path.is_file() or snapshot_path.stat().st_size == 0:
    raise RuntimeError("Telethon session snapshot is empty")
connection = sqlite3.connect(f"file:{snapshot_path}?mode=ro", uri=True)
try:
    result = connection.execute("PRAGMA quick_check").fetchone()
    if result != ("ok",):
        raise RuntimeError(f"Host session snapshot quick_check failed: {result!r}")
finally:
    connection.close()
PY
}

snapshot_userbot_session() {
  local snapshot_tmp

  probe_userbot_session
  if [[ "$session_file_exists" != "1" ]]; then
    return 0
  fi

  snapshot_tmp="${session_snapshot_path}.tmp"
  rm -f "$snapshot_tmp"
  if ! write_userbot_session_snapshot "$snapshot_tmp"; then
    rm -f "$snapshot_tmp"
    return 1
  fi
  if ! verify_userbot_session_snapshot "$snapshot_tmp"; then
    rm -f "$snapshot_tmp"
    return 1
  fi

  chmod 0600 "$snapshot_tmp"
  mv -f "$snapshot_tmp" "$session_snapshot_path"
  session_snapshot_created=1
  echo "Verified userbot session snapshot: $session_snapshot_path"
}
'''
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          PY
          bash -n deploy/server/deploy.sh
      - name: Regenerate all deterministic dependency locks
        run: |
          rm -rf generated-locks /tmp/generated-locks
          scripts/compile_locks.sh generated-locks
          for group in bot userbot tools dev; do
            cp "generated-locks/$group.lock" "requirements/$group.lock"
          done
      - name: Commit bounded fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            deploy/server/deploy.sh \
            requirements/bot.lock \
            requirements/userbot.lock \
            requirements/tools.lock \
            requirements/dev.lock
          git commit -m 'fix: split snapshot flow and refresh dependency locks'
          git push origin "HEAD:$HEAD_REF"
