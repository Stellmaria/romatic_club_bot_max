name: Issue44 Migration Error Contract Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  changed-code-quality:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Update stable migration discovery assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_database_schema.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert "нет SQL-миграций" in str(error)'
          new = 'assert "No SQL migrations found" in str(error)'
          if text.count(old) != 1:
              raise SystemExit('unexpected migration discovery assertion')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit migration discovery contract
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_database_schema.py
          git commit -m 'test: update migration discovery error contract'
          git push origin "HEAD:$HEAD_REF"
