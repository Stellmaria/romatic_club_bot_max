name: Issue44 Migrator Typing Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  changed-code-quality:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply typed callback boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('db/migrator.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'import argparse\n': 'import argparse\nfrom collections.abc import Awaitable, Callable\n',
              'from typing import Any\n': 'from typing import Any, TypeVar\n',
              'logger = logging.getLogger("auction_bot.migrations")\n': (
                  'logger = logging.getLogger("auction_bot.migrations")\n\n'
                  'RuntimeResult = TypeVar("RuntimeResult")\n'
              ),
              'async def _with_database_runtime(database_url: str, callback: Any) -> Any:\n': (
                  'async def _with_database_runtime(\n'
                  '    database_url: str,\n'
                  '    callback: Callable[[asyncpg.Pool], Awaitable[RuntimeResult]],\n'
                  ') -> RuntimeResult:\n'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing source: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black db/migrator.py
      - name: Commit typed migrator
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db/migrator.py
          git commit -m 'fix: type migration runtime callback'
          git push origin "HEAD:$HEAD_REF"
