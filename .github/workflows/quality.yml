name: Issue44 Migration Default Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  changed-code-quality:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Disable application startup migrations by default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot/core/settings.py')
          text = path.read_text(encoding='utf-8')
          old = 'ConfigField("DB_AUTO_MIGRATE", ("bot", "userbot"), "database", default="true")'
          new = 'ConfigField("DB_AUTO_MIGRATE", ("bot", "userbot"), "database", default="false")'
          if text.count(old) != 1:
              raise SystemExit('unexpected DB_AUTO_MIGRATE schema source')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit canonical migration default
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/core/settings.py
          git commit -m 'fix: disable startup migrations by default'
          git push origin "HEAD:$HEAD_REF"
