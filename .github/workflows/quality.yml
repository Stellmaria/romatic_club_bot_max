name: Issue44 Database Schema Formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  changed-code-quality:
    if: github.event.pull_request.head.ref == 'feature/issue-44-database-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Format database schema contract
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          python -m black tests/test_database_schema.py
      - name: Commit exact formatting
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$HEAD_REF" = 'feature/issue-44-database-recovery'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_database_schema.py
          git commit -m 'style: format database schema contract'
          git push origin "HEAD:$HEAD_REF"
