name: Source Export PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source-pr
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
