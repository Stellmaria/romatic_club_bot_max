name: Temporary issue 41 autofix

on:
  push:
    branches:
      - security/issue-41-supply-chain

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: security/issue-41-supply-chain
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install formatters
        run: python -m pip install 'ruff>=0.14.7,<1' 'black>=26.3.1,<27'

      - name: Apply safe automated fixes
        run: |
          files=(
            bot/core/settings.py
            bot/tools/refresh_users.py
            scripts/check_dependency_licenses.py
            scripts/check_immutable_references.py
            scripts/migrate_uid_encryption.py
            tests/test_python_runtime_contract.py
            userbot/application.py
          )
          python -m ruff check \
            --select E,F,I,B,BLE,ASYNC,S,SIM,UP,C4,PIE,RUF,C90,ARG,PLR,PERF,PLC,PTH,RET \
            --ignore S101,S603,S607 \
            --fix --unsafe-fixes "${files[@]}" || true
          python -m black "${files[@]}"

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No automated changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            bot/core/settings.py \
            bot/tools/refresh_users.py \
            scripts/check_dependency_licenses.py \
            scripts/check_immutable_references.py \
            scripts/migrate_uid_encryption.py \
            tests/test_python_runtime_contract.py \
            userbot/application.py
          git commit -m 'style: apply issue 41 quality fixes'
          git push origin HEAD:security/issue-41-supply-chain
