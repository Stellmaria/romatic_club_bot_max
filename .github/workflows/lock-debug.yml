name: Lock Debug

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: lock-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh-locks:
    name: refresh-locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Refresh and commit dependency locks
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          scripts/compile_locks.sh requirements
          if git diff --quiet -- requirements/*.lock; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements/*.lock
          git commit -m "build: refresh reproducible dependency locks"
          git push origin "HEAD:${HEAD_BRANCH}"
