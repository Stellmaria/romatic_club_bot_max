name: Apply issue 29 regression fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-29-admin-boundaries
          fetch-depth: 0
      - name: Preserve keyboard rows and count registrations correctly
        run: |
          python - <<'PY'
          from pathlib import Path

          keyboards = Path('bot/handlers/admin/helper/new/keyboards.py')
          source = keyboards.read_text(encoding='utf-8')
          old = '''def menu_keyboard(*rows: Any) -> ReplyKeyboardMarkup:
              kb = ReplyKeyboardBuilder()
              for row in rows:
                  if isinstance(row, (list, tuple)):
                      kb.add(*(KeyboardButton(text=str(text)) for text in row))
                      kb.adjust(len(row))
                  else:
                      kb.add(KeyboardButton(text=str(row)))
                      kb.adjust(1)
              return kb.as_markup(resize_keyboard=True)
          '''
          new = '''def menu_keyboard(*rows: Any) -> ReplyKeyboardMarkup:
              """Build a reply keyboard without reflowing previously added rows."""

              kb = ReplyKeyboardBuilder()
              for row in rows:
                  values = row if isinstance(row, (list, tuple)) else (row,)
                  kb.row(*(KeyboardButton(text=str(text)) for text in values))
              return kb.as_markup(resize_keyboard=True)
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if source.count(old) != 1:
              raise SystemExit('unexpected menu_keyboard implementation')
          keyboards.write_text(source.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_admin_handler_split.py')
          source = tests.read_text(encoding='utf-8')
          marker = '''def _registered_handler_count(router: object) -> int:
              observers = getattr(router, "observers")
              return sum(len(observer.handlers) for observer in observers.values())
          '''
          replacement = '''def _registered_handler_count(router: object) -> int:
              observers = getattr(router, "observers")
              return sum(len(observer.handlers) for observer in observers.values())


          def _declared_handler_registration_count(module: str) -> int:
              return sum(
                  1
                  for node in _tree(module).body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  for decorator in node.decorator_list
                  if any(
                      isinstance(item, ast.Name) and item.id == "router"
                      for item in ast.walk(decorator)
                  )
              )
          '''
          marker = '\n'.join(line[10:] if line.startswith('          ') else line for line in marker.splitlines())
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          if source.count(marker) != 1:
              raise SystemExit('unexpected registered handler helper')
          source = source.replace(marker, replacement)
          old_assertion = '            assert _registered_handler_count(module.router) == len(names)\n'
          new_assertion = '            assert _registered_handler_count(module.router) == (\n                _declared_handler_registration_count(feature)\n            )\n'
          if source.count(old_assertion) != 1:
              raise SystemExit('unexpected handler registration assertion')
          tests.write_text(source.replace(old_assertion, new_assertion), encoding='utf-8')
          PY
      - name: Validate focused behavior
        run: |
          python -m compileall -q \
            bot/handlers/admin/helper/new/keyboards.py \
            tests/test_admin_handler_split.py \
            tests/test_admin_navigation_behavior.py
          python -m pip install -q aiogram==3.22.0 pytest==9.0.2 pytest-asyncio==1.3.0
          python -m pytest -q \
            tests/test_admin_handler_split.py \
            tests/test_admin_navigation_behavior.py
          git diff --check
      - name: Commit code fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            bot/handlers/admin/helper/new/keyboards.py \
            tests/test_admin_handler_split.py
          git commit -m "fix(admin): preserve reply-keyboard row layout"
          git push origin HEAD:refactor/issue-29-admin-boundaries
