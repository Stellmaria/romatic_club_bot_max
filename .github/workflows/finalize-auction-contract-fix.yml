name: Finalize auction contract fix

on:
  push:
    branches:
      - fix/auction-deadline-multicurrency-reverse
    paths:
      - scripts/finalize_auction_contract_fix.py
      - .github/workflows/finalize-auction-contract-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auction-deadline-multicurrency-reverse
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply deterministic final patch
        run: python scripts/finalize_auction_contract_fix.py
      - name: Compile touched runtime modules
        run: |
          python -m py_compile \
            userbot/services.py \
            userbot/handlers/new_messages.py \
            bot/handlers/auction/winner_components/announcement.py
      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align userbot and winner currency handling"
          git push origin HEAD:fix/auction-deadline-multicurrency-reverse
