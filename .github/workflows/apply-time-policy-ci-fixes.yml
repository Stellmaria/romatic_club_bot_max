name: Apply Time Policy CI Fixes

on:
  push:
    branches: [codex/issue-37-time-policy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-time-policy-ci-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-37-time-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install black==25.11.0
          python -m black \
            bot/application_models.py \
            scripts/check_time_policy.py \
            bot/use_cases/auction_moderation.py \
            tests/test_auction_domain.py \
            tests/integration/test_migrations_postgres.py \
            bot/repositories/auction_workflows.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/ci.yml'): (
                  "017_query_performance_indexes.sql",
                  "018_utc_timestamp_policy.sql",
              ),
              Path('tests/test_runtime_schedule_migration.py'): (
                  "017_query_performance_indexes.sql",
                  "018_utc_timestamp_policy.sql",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old!r} missing from {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm -f .github/workflows/apply-time-policy-ci-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/apply-time-policy-ci-fixes.yml \
            .github/workflows/ci.yml \
            bot/application_models.py \
            bot/repositories/auction_workflows.py \
            bot/use_cases/auction_moderation.py \
            scripts/check_time_policy.py \
            tests/integration/test_migrations_postgres.py \
            tests/test_auction_domain.py \
            tests/test_runtime_schedule_migration.py
          git diff --cached --check
          git commit -m 'fix(time): satisfy formatting and migration contracts'
          git push origin HEAD:codex/issue-37-time-policy
