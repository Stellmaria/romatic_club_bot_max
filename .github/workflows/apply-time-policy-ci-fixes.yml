name: Export Time Policy CI Fixes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build deterministic CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install black==25.11.0
          python -m black \
            bot/application_models.py \
            scripts/check_time_policy.py \
            bot/use_cases/auction_moderation.py \
            tests/test_auction_domain.py \
            tests/integration/test_migrations_postgres.py \
            bot/repositories/auction_workflows.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('.github/workflows/ci.yml'): (
                  "017_query_performance_indexes.sql",
                  "018_utc_timestamp_policy.sql",
              ),
              Path('tests/test_runtime_schedule_migration.py'): (
                  "017_query_performance_indexes.sql",
                  "018_utc_timestamp_policy.sql",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old!r} missing from {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          mkdir -p var/time-policy-ci-fixes
          cp --parents \
            .github/workflows/ci.yml \
            bot/application_models.py \
            bot/repositories/auction_workflows.py \
            bot/use_cases/auction_moderation.py \
            scripts/check_time_policy.py \
            tests/integration/test_migrations_postgres.py \
            tests/test_auction_domain.py \
            tests/test_runtime_schedule_migration.py \
            var/time-policy-ci-fixes/
      - name: Upload deterministic CI fixes
        uses: actions/upload-artifact@v4
        with:
          name: time-policy-ci-fixes
          path: var/time-policy-ci-fixes
          if-no-files-found: error
          retention-days: 1
