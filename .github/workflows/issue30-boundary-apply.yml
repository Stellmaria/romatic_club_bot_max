name: Apply issue 30 handler boundary

on:
  push:
    branches: [refactor/issue-30-application-use-cases]
    paths:
      - '.issue30-boundary.patch'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-30-application-use-cases
      - name: Apply boundary patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .issue30-boundary.patch
          git apply .issue30-boundary.patch
          rm .issue30-boundary.patch .github/workflows/issue30-boundary-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            bot/handlers/admin/admin_panel_schedule.py \
            bot/handlers/admin/moderation_lots.py \
            bot/handlers/auction/exchange/submission.py \
            bot/handlers/auction/publication.py \
            bot/handlers/auction/submission.py \
            bot/handlers/users.py \
            bot/services/handler_persistence.py \
            tests/test_architecture_boundaries.py \
            .issue30-boundary.patch \
            .github/workflows/issue30-boundary-apply.yml
          git diff --cached --check
          git commit -m "refactor(handlers): enforce application persistence boundary"
          git push origin HEAD:refactor/issue-30-application-use-cases
