name: Black Format Diagnostic

on:
  pull_request:
    paths:
      - "tests/integration/test_privacy_export_postgres.py"
      - ".github/workflows/black-format-diagnostic.yml"

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install formatter
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Show exact Black diff
        run: python -m black --diff --check tests/integration/test_privacy_export_postgres.py
