name: Lock Repro Diagnostic

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install hashed security tooling
        run: uv pip install --system --require-hashes --no-deps -r requirements/tools.lock
      - name: Generate lock files
        run: scripts/compile_locks.sh generated-locks
      - name: Upload generated lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-locks
          path: generated-locks/*.lock
          if-no-files-found: error
          retention-days: 1
      - name: Upload current lock files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: current-locks
          path: requirements/*.lock
          if-no-files-found: error
          retention-days: 1
      - name: Show reproducibility diff
        run: |
          for group in bot userbot tools dev; do
            diff -u "requirements/${group}.lock" "generated-locks/${group}.lock"
          done
