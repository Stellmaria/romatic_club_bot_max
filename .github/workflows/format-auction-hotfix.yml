name: Format auction hotfix

on:
  push:
    branches: [fix/auction-notification-opt-out]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/auction-notification-opt-out
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install pinned development dependencies
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Format changed Python files
        run: python -m black bot/auction_notify.py tests/test_auction_notification_recipients.py
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot/auction_notify.py tests/test_auction_notification_recipients.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format auction notification hotfix"
          git push origin HEAD:fix/auction-notification-opt-out
