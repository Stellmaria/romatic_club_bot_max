name: Privacy cleanup Black diff

on:
  push:

permissions:
  contents: read

jobs:
  diff:
    if: >-
      github.ref == 'refs/heads/privacy/approved-temporary-cleanup' &&
      github.event.head_commit.message == 'chore(ci): inspect Black cleanup diff'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: requirements/*.lock
      - name: Install pinned development graph
        run: uv pip install --system --require-hashes --no-deps -r requirements/dev.lock
      - name: Print exact formatter diff
        run: python -m black --diff tests/integration/test_privacy_cleanup_postgres.py
