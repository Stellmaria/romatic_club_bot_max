name: PR98 Audit Debug

on:
  push:
    branches:
      - feat/issue-42-observability

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-42-observability
          fetch-depth: 0
      - name: Capture audit configuration
        shell: bash
        run: |
          mkdir -p .tmp
          {
            echo '=== workflow files ==='
            find .github/workflows -maxdepth 1 -type f -print | sort
            echo
            echo '=== audit references ==='
            grep -Rni -B 20 -A 60 -E 'dependency-audit|pip-audit|audit' .github/workflows || true
          } > .tmp/pr98-audit-debug.txt
      - name: Publish debug output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/pr98-audit-debug.txt
          git commit -m 'chore: capture dependency audit configuration'
          git push origin HEAD:feat/issue-42-observability
