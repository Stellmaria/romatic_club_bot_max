name: PR98 Dependency Fix

on:
  push:
    branches:
      - feat/issue-42-observability

permissions:
  contents: write

concurrency:
  group: pr98-dependency-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-42-observability
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Regenerate canonical locks
        shell: bash
        run: scripts/compile_locks.sh requirements
      - name: Verify the updated locked graphs
        shell: bash
        run: |
          uv pip install --system --require-hashes --no-deps -r requirements/tools.lock
          read -r -a ignores <<< "$(python scripts/check_vulnerability_exceptions.py --format pip-audit)"
          for lock in requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock; do
            pip-audit --strict --progress-spinner=off --disable-pip --no-deps -r "$lock" "${ignores[@]}"
          done
      - name: Publish regenerated locks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build(deps): regenerate locks for cryptography 50'
          git push origin HEAD:feat/issue-42-observability
