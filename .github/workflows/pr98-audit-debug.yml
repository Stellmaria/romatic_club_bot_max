name: PR98 Audit Debug

on:
  push:
    branches:
      - feat/issue-42-observability

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-42-observability
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.16"
      - name: Install hashed security tooling
        run: uv pip install --system --require-hashes --no-deps -r requirements/tools.lock
      - name: Capture exact dependency audit output
        shell: bash
        run: |
          mkdir -p .tmp
          set +e
          {
            echo '=== active exceptions ==='
            python scripts/check_vulnerability_exceptions.py --format pip-audit
            echo
            read -r -a ignores <<< "$(python scripts/check_vulnerability_exceptions.py --format pip-audit)"
            for lock in requirements/bot.lock requirements/userbot.lock requirements/tools.lock requirements/dev.lock; do
              echo "=== $lock ==="
              pip-audit --strict --progress-spinner=off --disable-pip --no-deps -r "$lock" "${ignores[@]}"
              echo "exit=$?"
              echo
            done
          } > .tmp/pr98-audit-output.txt 2>&1
          exit 0
      - name: Publish audit output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp/pr98-audit-output.txt
          git commit -m 'chore: capture dependency audit output'
          git push origin HEAD:feat/issue-42-observability
