name: Apply Issue 27 Patch

on:
  push:
    branches:
      - codex/issue-27-central-config
    paths:
      - .github/workflows/apply-issue-27.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/issue-27-patch/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/issue27.patch
          echo "7805beae26018fc59ea8f55f5d2004c8e0f5b3193f85a64237e9b1ece7e09741  /tmp/issue27.patch" \
            | sha256sum --check -
      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/issue27.patch
          rm -rf .github/issue-27-patch
          rm -f .github/workflows/apply-issue-27.yml
          git add -A
          python -m compileall -q bot database db userbot scripts main.py config.py fsm_states.py backfill.py find_discussion_id.py migrate_uid_encryption.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: centralize strict process configuration"
          git push origin HEAD:codex/issue-27-central-config
