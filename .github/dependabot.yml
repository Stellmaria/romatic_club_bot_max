version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      telegram-runtime:
        patterns:
          - aiogram
          - aiofiles
          - aiohttp
          - aiosignal
          - telethon
      persistence-and-crypto:
        patterns:
          - asyncpg
          - cryptg
          - cryptography
      quality-tooling:
        dependency-type: development
        patterns:
          - pytest*
          - coverage
          - ruff
          - black
          - mypy
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Warsaw
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - security

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    groups:
      production-images:
        patterns:
          - "*"
    labels:
      - dependencies
      - security
